<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>emu-composer</title>
<style>
  :root{
    --bg:#0d0e13; --panel:#14161d; --panel2:#1b1e27; --line:#262a36; --line2:#333949;
    --fg:#e7e9f0; --dim:#868da3; --dim2:#5d6478;
    --accent:#f97316; --accent-fg:#140b03; --accent2:#38bdf8; --ok:#34d399; --bad:#f87171; --warn:#fbbf24; --rec:#ef4444;
    --r:4px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);height:100vh;overflow:hidden;display:flex;
       font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .lbl{font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
  kbd{font:500 10px/1 var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:3px;padding:2px 4px;margin-inline-start:6px}

  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:var(--r);
         padding:6px 12px;font:550 12px/1.35 inherit;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap}
  button:hover:not(:disabled){background:#252936;border-color:#454c62}
  button:active:not(:disabled){background:#2c3140}
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:650}
  button.primary:hover:not(:disabled){background:#fb8a3c;border-color:#fb8a3c}
  button.primary.done{background:var(--ok);border-color:var(--ok);color:#04231a;transform:scale(1.03)}
  button.primary.fail{background:var(--bad);border-color:var(--bad);color:#fff}
  button.primary{transition:background .15s,border-color .15s,transform .15s}
  button.ghost{background:none;border-color:transparent;color:var(--dim)}
  button.ghost:hover:not(:disabled){background:var(--panel2);color:var(--fg)}
  input{background:#0a0b0f;color:var(--fg);border:1px solid var(--line2);border-radius:var(--r);padding:6px 9px;font:12px/1.4 var(--mono);outline:none}
  input:focus{border-color:var(--accent2)}
  select{background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:var(--r);padding:5px 8px;font:550 11.5px/1.3 var(--mono);max-width:210px;outline:none;cursor:pointer}
  select:focus{border-color:var(--accent2)}
  select.bad{color:var(--bad);border-color:#5c2a2a}
  .seg{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
  .seg button{border:none;border-radius:0;background:var(--panel);color:var(--dim);padding:6px 13px}
  .seg button + button{border-inline-start:1px solid var(--line2)}
  .seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:650}
  .seg button.on.alt{background:var(--accent2);color:#04202b}
  .pill{font:600 10px/1 var(--mono);letter-spacing:.06em;padding:4px 7px;border-radius:3px;border:1px solid var(--line2);color:var(--dim2)}
  .pill.on{color:var(--ok);border-color:#1f5c48}
  .pill.bad{color:var(--bad);border-color:#5c2a2a}

  /* ================= emulator column ================= */
  #left{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-inline-end:1px solid var(--line);background:var(--panel)}
  .bar{display:flex;align-items:center;gap:8px}
  #modehint{color:var(--dim2);font-size:11px;margin-inline-start:auto;text-align:end;max-width:220px;line-height:1.35}
  #screen{position:relative;line-height:0;overflow:hidden;border:1px solid var(--line2);background:#000;align-self:center;outline:none}
  body.collect #screen{border-color:var(--accent);cursor:crosshair}
  body.use #screen{border-color:var(--accent2)}
  body.use #screen:focus{box-shadow:0 0 0 1px var(--accent2)}
  #shot{display:block;max-height:calc(100vh - 176px);width:auto;user-select:none;-webkit-user-drag:none}
  #ov{position:absolute;inset:0}
  #marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #marks .hl{filter:drop-shadow(0 0 3px #fff)}
  #tools{display:none;min-height:30px}
  body.collect #tools,body.jem #tools{display:flex}
  #tools .seg button{padding:5px 10px;font-size:11px}
  #colors{display:flex;gap:5px;align-items:center}
  .sw{width:16px;height:16px;border-radius:50%;border:2px solid transparent;padding:0;background:var(--c);cursor:pointer}
  .sw.on{border-color:#fff}
  .chip.mark{background:#ef444418;border-color:#ef444470;color:#fca5a5}
  .chip.mark:hover{background:#ef444436;border-color:#ef4444}
  .box{position:absolute;border:1px solid transparent;pointer-events:none}
  .box.hot{border-color:var(--accent2);background:#38bdf81c;box-shadow:0 0 0 1px #0009 inset}
  .box.pick{border-color:var(--accent);background:#f9731626}
  .tag{position:absolute;top:0;inset-inline-start:0;transform:translateY(-100%);background:var(--accent2);color:#04202b;
       font:700 10px/1.6 var(--mono);padding:0 5px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;direction:ltr}
  .box.pick .tag{background:var(--accent);color:var(--accent-fg)}
  .box.flip .tag{top:auto;bottom:0;transform:translateY(100%)}
  #busy{position:absolute;inset-inline-end:8px;top:8px;font:600 10px/1 var(--mono);color:var(--accent2);background:#0009;padding:4px 6px;display:none}
  #busy.show{display:block}
  #lost{position:absolute;inset:0;background:#000c;color:var(--bad);display:none;align-items:center;justify-content:center;
        font:600 12px/1.5 var(--mono);text-align:center;padding:20px}
  #lost.show{display:flex}
  #navbar{display:flex;gap:5px;justify-content:center}
  #navbar button{padding:5px 12px;font-size:11px;font-family:var(--mono)}

  /* ================= composer column ================= */
  #right{flex:1 1 auto;min-width:430px;display:flex;flex-direction:column;overflow:hidden}
  .row{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  /* The mic lives inside the text box, bottom-right, positioned against a wrapper so it
     neither scrolls with the text nor breaks #editor:empty (the placeholder). */
  #edwrap{position:relative;flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
  #rec{position:absolute;right:14px;bottom:12px;z-index:2;width:38px;height:38px;padding:0;border-radius:50%;
       display:flex;align-items:center;justify-content:center;background:none;border:none;color:var(--dim);
       --lv:0;transition:color .12s,background .12s,box-shadow .07s}
  #rec svg,#refine svg{width:20px;height:20px;display:block}
  /* The AI edit button sits beside the mic; at the dictation level it still edits on demand. */
  #refine{position:absolute;right:58px;bottom:12px;z-index:2;width:38px;height:38px;padding:0;border-radius:50%;
          display:flex;align-items:center;justify-content:center;background:none;border:none;color:#c4b5fd}
  #refine:hover:not(:disabled){background:var(--panel2);color:#ddd6fe}
  @keyframes spin{to{transform:rotate(360deg)}}
  .aiseg button{padding:4px 9px;font-size:11px}
  .aiseg button.on{background:#a78bfa;color:#1a1033}
  #rec:hover:not(:disabled){background:var(--panel2);color:var(--fg)}
  /* Recording: red, with a ring that swells with the input level — the only sign the mic hears you. */
  #rec.on{color:#fff;background:var(--rec);box-shadow:0 0 0 calc(3px + var(--lv) * 12px) #ef444440}
  #rec.on:hover:not(:disabled){background:#dc2626;color:#fff}
  #status{margin-inline-start:auto;color:var(--dim);font-size:11.5px;text-align:end;flex:0 1 auto;min-width:0;max-width:340px;
          font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #status.busy{color:var(--accent2)} #status.err{color:var(--bad)} #status.ok{color:var(--ok)}

  #editor{flex:1 1 auto;overflow:auto;padding:18px 20px 60px;font-size:14.5px;line-height:1.8;outline:none;white-space:pre-wrap;word-break:break-word;caret-color:var(--accent)}
  #editor:empty::before{content:attr(data-ph);color:var(--dim2);font-size:13px}
  /* An INLINE box (not inline-block): its background hugs the glyphs, so it sits on the
     sentence's baseline at the sentence's size instead of floating above it. */
  .chip{display:inline;background:#f973161f;border:1px solid #f9731670;color:#fdba74;border-radius:3px;padding:1px 6px;margin:0 1px;
        font:600 0.9em/1 var(--mono);cursor:pointer;user-select:none;direction:ltr;unicode-bidi:isolate;white-space:nowrap;
        -webkit-box-decoration-break:clone;box-decoration-break:clone;vertical-align:baseline}
  .chip:hover{background:#f9731636;border-color:var(--accent)}
  .chip.flash{background:var(--ok);border-color:var(--ok);color:#04231a}
  .chip.stale{border-style:dashed;opacity:.8}
  .chip b{opacity:.6;font-weight:700}
  #editor.dual .chip[data-platform="ios"] bdi::before{content:"iOS · ";opacity:.65;font-size:.85em}
  #editor.dual .chip[data-platform="android"] bdi::before{content:"Android · ";opacity:.65;font-size:.85em}
  /* A segment being transcribed: a small spinning ring where its words will land. */
  .interim{display:inline-block;width:.95em;height:.95em;vertical-align:-.14em;margin:0 4px;border-radius:50%;
           border:2px solid #38bdf840;border-top-color:var(--accent2);animation:spin .75s linear infinite;color:transparent;overflow:hidden}
  body.burst #ov, body.burst #marks{visibility:hidden}

  #keyrow{display:none;gap:8px;align-items:center;background:#171213;border-bottom:1px solid #3a2a20}
  #keyrow.show{display:flex}
  #apikey{flex:1 1 auto;min-width:200px}
  #warn{display:none;width:100%;color:var(--warn);font-size:11.5px;font-family:var(--mono)}
  #warn.show{display:block}
  #ctx{margin-inline-start:auto;color:var(--dim2);font:11px/1.5 var(--mono);text-align:end;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
  label.opt{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:11.5px;cursor:pointer;user-select:none}

  /* history panel */
  .side{position:absolute;inset-inline-end:0;top:0;bottom:0;width:min(520px,60vw);background:var(--panel);border-inline-start:1px solid var(--line2);
        display:none;flex-direction:column;z-index:5;box-shadow:-10px 0 30px #0008}
  .side.show{display:flex}
  .sbody{padding:8px 14px;overflow:auto}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .snote{color:var(--dim2);font-size:11px;padding:8px 0 4px}
  #hist .row{justify-content:space-between}
  #histlist{overflow:auto;flex:1 1 auto}
  .hitem{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer}
  .hitem:hover{background:var(--panel2)}
  .hitem .t{font:500 10.5px/1 var(--mono);color:var(--dim2);margin-bottom:4px}
  .hitem .p{font-size:12.5px;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #right{position:relative}
  #problems{display:none;flex-direction:column;gap:1px;background:var(--line)}
  #problems.on{display:flex}
  .prob{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;background:var(--panel2)}
  .prob.error{background:#3a1414;color:#ffb4b4}
  .prob.warn{background:#3a2c12;color:#ffd9a0}
  .prob.info{background:var(--panel2);color:var(--dim2)}
  .prob b{font-weight:600}
  .prob button{font-size:11px;padding:2px 8px;margin-inline-start:auto;white-space:nowrap}
  .cnt{font:600 10px/1 var(--mono);color:var(--dim2);margin-inline-start:4px}
  .cnt.has{color:#ffb4b4}
  #project{max-width:150px}

  /* ================= jem: guide | emulator | text ================= */
  .seg button.on.jm{background:#a78bfa;color:#1a1033}
  body.jem #screen{border-color:#a78bfa}
  body.jem.kbdapp #screen{box-shadow:0 0 0 3px #a78bfa}
  body.jem.kbdapp #editor{opacity:.55}
  body.jem #modehint{display:none}
  #guide{display:none}
  /* Guide and text share the leftover width equally, so the emulator sits in the middle. */
  body.jem #guide{display:flex;flex-direction:column;gap:14px;flex:1 1 0;min-width:240px;overflow:auto;padding:16px 18px;
                  background:var(--panel);border-inline-end:1px solid var(--line)}
  body.jem #right{flex:1 1 0;min-width:340px}
  #guide h2{margin:0;font:700 18px/1.2 inherit;color:#c4b5fd}
  #guide p{margin:0;color:var(--dim);font-size:12.5px;line-height:1.55}
  .gstate{display:flex;flex-wrap:wrap;gap:6px}
  .gstate button{font:600 11px/1 var(--mono);padding:5px 8px;border-radius:3px;border:1px solid var(--line2);color:var(--dim);background:none}
  .gstate button:hover{border-color:#a78bfa;color:var(--fg)}
  .gstate button.hot{color:#1a1033;background:#a78bfa;border-color:#a78bfa}
  .gstate button.rec{color:#fff;background:var(--rec);border-color:var(--rec)}
  .gsec{display:flex;flex-direction:column;gap:2px}
  .gsec .lbl{margin-bottom:6px}
  .grow{display:flex;align-items:baseline;gap:10px;padding:4px 0;border-bottom:1px solid var(--line);font-size:12.5px;color:var(--fg)}
  .grow kbd{margin:0;flex:0 0 auto;min-width:74px;text-align:center;color:#c4b5fd;border-color:#3b3456;padding:3px 5px}
  .grow.flash{background:#a78bfa22}
  #guide ul{margin:0;padding-inline-start:18px;color:var(--dim);font-size:12px;line-height:1.6}

  /* ================= polish: one quiet visual system ================= */
  :root{--bg:#0b0c10;--panel:#101217;--panel2:#161920;--line:#1d2129;--line2:#282d37;--fg:#e9ebf1;--dim:#8b91a3;--dim2:#5b6273;--r:8px;
        --violet:#a78bfa;--violet-soft:#a78bfa1f;
        /* history sidebar: a touch darker than the canvas, not the (lighter) panel colour */
        --sidebar-bg:color-mix(in srgb, var(--bg), #000 4%)}
  body{font-size:13px}
  button{height:30px;padding:0 12px;border-radius:var(--r);font-weight:520;letter-spacing:.005em;border-color:var(--line2)}
  button.ghost{color:var(--dim)}
  button.ic{width:30px;padding:0;display:inline-flex;align-items:center;justify-content:center}
  button.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .seg{border-radius:var(--r);border-color:var(--line2);background:var(--panel)}
  .seg button{height:28px;background:none;font-weight:520}
  .seg button + button{border-inline-start:none}
  .seg button.on{border-radius:6px;margin:1px}
  select{height:30px;border-radius:var(--r);font:500 12px/1.2 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;padding:0 10px;background:var(--panel2)}
  kbd{font:500 10.5px/1 var(--mono);border-radius:5px;color:var(--dim);background:var(--panel2);border-color:var(--line2)}
  input[type=checkbox]{accent-color:var(--violet);margin:0}

  #left{gap:10px;padding:12px 14px;background:var(--panel)}
  #left > .bar:first-child{gap:6px}
  #modehint{font-size:11px;color:var(--dim2)}
  #problems{border-radius:var(--r);overflow:hidden;background:transparent;gap:4px}
  .prob{border-radius:var(--r);padding:6px 10px;font-size:11.5px;background:var(--panel2);border:1px solid var(--line)}
  .prob.warn{background:#fbbf2410;color:#e9c47a;border-color:#fbbf2428}
  .prob.error{background:#f8717112;color:#f3a5a5;border-color:#f8717130}
  .prob button{height:24px;font-size:11px}
  #tools{gap:10px;justify-content:center}
  #tools .seg button{width:32px;height:28px;padding:0}
  .sw{width:14px;height:14px}
  #screen{border-radius:14px;border-width:1px;box-shadow:0 12px 40px #0008}
  body.collect #screen{border-color:#f9731699}
  body.use #screen{border-color:#38bdf899}
  body.jem #screen{border-color:#a78bfa99}
  #navbar{gap:2px}
  #navbar button{height:28px;width:34px;font-size:12px}
  #agentpill{width:8px;height:8px;padding:0;border-radius:50%;border:none;background:var(--dim2);margin-inline-start:8px;align-self:center}
  #agentpill.on{background:var(--ok)} #agentpill.bad{background:#f8717199}

  #right > .row:first-child{border-bottom:none;padding:0 26px;gap:16px;height:48px}
  #status{margin-inline-start:0;margin-inline-end:auto;font:500 11.5px/1.3 -apple-system,system-ui,sans-serif;color:var(--dim2)}
  #editor{padding:22px 26px 64px;font-size:15px;line-height:1.85}
  #editor:empty::before{font-size:13.5px;line-height:1.7}
  .chip{border-radius:5px;padding:1px 7px}
  #foot{border-top:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
  .frow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .frow .grow{flex:1 1 auto}
  .frow.opts{gap:14px}
  .aiwrap{display:inline-flex;align-items:center;gap:8px}
  .flbl{font:600 10.5px/1 var(--mono);color:var(--dim2);letter-spacing:.06em}
  .aiseg button{height:26px;padding:0 10px;font-size:11.5px}
  label.tog{display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12px;cursor:pointer;user-select:none}
  label.tog:hover{color:var(--fg)}
  #warn{display:none!important}
  .runwrap{display:inline-flex;align-items:center}
  .runwrap select{height:32px;border-radius:var(--r) 0 0 var(--r);border-inline-end:none;max-width:140px}
  [dir] .runwrap select{border-radius:var(--r) 0 0 var(--r)}
  #runAgent{height:32px;border-radius:0 var(--r) var(--r) 0;background:#a78bfa1f;border-color:#a78bfa55;color:#ddd6fe}
  #runAgent:hover:not(:disabled){background:#a78bfa33;border-color:var(--violet)}
  #runAgent.done{background:var(--ok);border-color:var(--ok);color:#04231a}
  body.jem #toolseg button.on{background:var(--violet);color:#1a1033}
  #ctx{margin-inline-start:auto;max-width:45%}
  button.primary{height:32px;padding:0 16px;border-radius:var(--r)}

  /* jem: calm guide, basics first */
  body.jem #guide{gap:16px;padding:22px 22px;background:var(--panel)}
  #guide h2{font:650 17px/1.2 inherit;color:var(--fg);letter-spacing:.01em}
  #guide h2::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--violet);margin-inline-end:9px;vertical-align:2px}
  #guide p{font-size:13px;line-height:1.6;color:var(--dim)}
  .gstate{gap:6px}
  .gstate button{height:26px;padding:0 10px;font:520 11.5px/1 -apple-system,system-ui,sans-serif;border-radius:13px;color:var(--dim);background:var(--panel2);border-color:var(--line)}
  .gstate button.hot{background:var(--violet-soft);color:#d8ccff;border-color:#a78bfa55}
  .gstate button.rec{background:#ef444422;color:#fca5a5;border-color:#ef444466}
  .grow{border-bottom:none;padding:5px 0;font-size:12.5px;color:#c9cdd8}
  .grow kbd{min-width:70px;background:none;border-color:var(--line2);color:#c4b5fd}
  .grow.flash{background:var(--violet-soft);border-radius:6px}
  details.gmore{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:14px}
  details.gmore summary{cursor:pointer;color:var(--dim);font-size:12px;list-style:none;user-select:none}
  details.gmore summary::before{content:'›';display:inline-block;width:14px;transition:transform .15s}
  details.gmore[open] summary::before{transform:rotate(90deg)}
  details.gmore > * + *{margin-top:12px}

  /* ================= dropdowns with real dots ================= */
  select.dd-model{display:none!important}
  .dd{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 8px 0 10px;border-radius:var(--r);background:var(--panel2);
      border:1px solid var(--line2);color:var(--fg);font:500 12px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;max-width:230px}
  .dd:hover:not(:disabled){border-color:#3a4150;background:#1b1f27}
  .dd.open{border-color:#4b5366}
  .dd.bad{color:var(--bad);border-color:#5c2a2a}
  .ddl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .ddc{width:14px;height:14px;flex:0 0 auto;fill:none;stroke:var(--dim);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .dot{flex:0 0 auto;width:7px;height:7px;border-radius:50%;background:#4a505f;display:inline-block}
  .dot.on{background:#34d399;box-shadow:0 0 0 3px #34d39922}
  .ddm{position:fixed;z-index:50;display:flex;flex-direction:column;padding:5px;border-radius:10px;background:#15181f;
       border:1px solid var(--line2);box-shadow:0 14px 40px #000a,0 2px 8px #0006;max-height:60vh;overflow:auto}
  .ddm button{height:auto;min-height:34px;display:grid;grid-template-columns:auto 1fr;align-items:center;column-gap:10px;row-gap:1px;
              padding:6px 10px;border:none;border-radius:7px;background:none;color:var(--fg);text-align:start;font:500 12.5px/1.3 -apple-system,system-ui,sans-serif}
  .ddm button:not(:has(.dot)){grid-template-columns:1fr}
  .ddm button:hover:not(:disabled){background:#ffffff0d}
  .ddm button.on{background:#ffffff12}
  .ddm small{grid-column:2;color:var(--dim2);font-size:11px}
  .ddm button:not(:has(.dot)) small{grid-column:1}

  /* ================= layout: guide | device | text, in every mode ================= */
  body{--gw:290px;--rw:460px}
  body.collect #guide, body.use #guide, body.jem #guide{display:flex;flex-direction:column;flex:0 0 var(--gw);width:var(--gw);min-width:0;
    gap:16px;padding:22px;overflow:auto;background:var(--sidebar-bg);border:none}
  body.guide-off #guide, body.guide-off .split[data-side="guide"]{display:none}
  #guide[data-mode="collect"] h2::before{background:var(--accent)}
  #guide[data-mode="use"] h2::before{background:var(--accent2)}
  .split{flex:0 0 1px;background:var(--line);position:relative;cursor:col-resize;z-index:4}
  .split::after{content:'';position:absolute;inset:0 -4px;}
  .split:hover, .split.dragging{background:#a78bfa88}
  body.resizing{cursor:col-resize;user-select:none}
  body.resizing #screen{pointer-events:none}
  #left, body.jem #left{flex:1 1 auto;min-width:280px;padding:10px 14px 12px;gap:8px;border:none;display:flex;flex-direction:column}
  body.collect #right, body.use #right, body.jem #right{flex:0 0 var(--rw);width:var(--rw);min-width:0}
  #topbar{gap:6px;justify-content:center;flex-wrap:wrap}
  /* two independent on/off switches replacing the old 3-way mode selector */
  .togs{display:flex;align-items:center;gap:14px}
  .swtoggle{display:inline-flex;align-items:center;gap:7px;cursor:pointer;user-select:none;color:var(--dim);font:600 11.5px/1 -apple-system,BlinkMacSystemFont,system-ui,sans-serif}
  .swtoggle:hover{color:var(--fg)}
  .swtoggle input{position:absolute;opacity:0;width:0;height:0}
  .swtrack{position:relative;flex:0 0 auto;width:30px;height:18px;border-radius:9px;background:var(--line2);transition:background .15s}
  .swtrack::after{content:'';position:absolute;top:2px;inset-inline-start:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:inset-inline-start .15s}
  .swtoggle input:checked + .swtrack{background:var(--accent2)}
  .swtoggle input:checked + .swtrack::after{inset-inline-start:14px}
  .swtoggle input:focus-visible + .swtrack{box-shadow:0 0 0 2px #38bdf855}
  [data-theme="light"] .swtrack{background:#d9dde4}
  #stage{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
  #shot{max-height:none}
  #tools, body.collect #tools, body.jem #tools{display:none}
  /* the dock: a slim vertical rail, draggable inside the device column */
  #dock{position:absolute;z-index:6;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 5px;
        background:#14171ecc;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line2);border-radius:12px;
        box-shadow:0 8px 28px #0007}
  #dock.dragging{box-shadow:0 12px 36px #000a;border-color:#a78bfa66}
  #dock .grip{display:flex;gap:3px;padding:3px 6px 5px;cursor:grab}
  #dock .grip i{width:3px;height:3px;border-radius:50%;background:var(--dim2)}
  #dock.dragging .grip{cursor:grabbing}
  body.collect #dock #tools, body.jem #dock #tools{display:flex}
  #dock #tools{flex-direction:column;align-items:center;gap:8px}
  #dock #toolseg{flex-direction:column;background:none;border:none}
  #dock #toolseg button, #dock #tools .seg button{width:32px;height:32px;padding:0;border-radius:8px;margin:1px 0}
  #dock #colors{flex-direction:column;gap:7px;padding:4px 0}
  #dock #undoMark{width:32px;height:30px}
  #dock #navbar{flex-direction:column;gap:2px;padding-top:6px;border-top:1px solid var(--line2)}
  body.use #dock #navbar{border-top:none;padding-top:0}
  #dock #navbar button{width:32px;height:30px}
  #dock button.ghost{color:#aeb4c4}
  #dock button.ghost:hover:not(:disabled){color:var(--fg)}

  /* narrow: guide off by default (see applyGuide); phone-ish: stack device over text */
  @media (max-width: 860px){
    body{flex-direction:column;overflow:auto;height:auto;min-height:100vh}
    body #guide, .split{display:none!important}
    #left, body.jem #left{flex:0 0 auto;height:64vh;min-width:0}
    body.collect #right, body.use #right, body.jem #right{flex:0 0 auto;width:auto;height:70vh}
    #topbar{justify-content:flex-start}
    #dock, #dock #tools, #dock #toolseg, #dock #colors, #dock #navbar{flex-direction:row}
    #dock #navbar{border-top:none;border-inline-start:1px solid var(--line2);padding:0 0 0 6px}
    #dock .grip{flex-direction:column;padding:4px 3px}
    #dock #colors{padding:0 4px}
    #stage{flex-direction:column;justify-content:flex-start;gap:10px;padding-top:4px}
    #dock{position:static;flex-wrap:wrap;justify-content:center;max-width:100%}
    #dock .grip{display:none}
  }

  /* ================= header · footer · settings modal ================= */
  /* Composer context header: ONLY project · device (a dot on it IS the connection state — no
     agent pill, no tokens, no settings, no status). Generous spacing, same horizontal padding
     as the text box below it so the two align; minimal text + chevron, no box. */
  #rhead{flex-wrap:nowrap}
  #rhead .dd{background:none;border-color:transparent;padding:0 2px;height:28px;max-width:170px;min-width:0;color:var(--dim2)}
  #rhead .dd:hover:not(:disabled){background:var(--panel2);border-color:transparent;color:var(--fg)}
  #rhead .dd.open{border-color:transparent}
  #rhead #agentpill{flex:0 0 auto;margin-inline-start:-8px}
  /* Transient status (copy/save confirmations, errors) plus the screen context — kept out of the
     header above so it never restates which device is connected. */
  #substatus{gap:8px;padding:0 26px 7px;min-height:0}
  #substatus #ctx{flex:0 1 auto;min-width:0;font:500 11px/1.3 var(--mono);color:var(--dim2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #substatus #status{margin:0;flex:1 1 auto;min-width:0;font-size:11px;text-align:end;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* the token estimate now lives in the text box's own toolbar, right before download/copy —
     a quiet counter beside the send-style actions, never competing with the text itself */
  #edact #tokest{flex:0 0 auto;color:var(--dim2);font:500 11px/1.3 var(--mono);white-space:nowrap;margin-inline-end:4px}
  #edact #tokest[hidden]{display:none}
  /* settings: a footer row at the bottom of the history sidebar, ChatGPT-style (ID beats
     .newprompt's own margin, which is meant for the top button, not this one) */
  #settingsbtn.sidefoot{margin:0 8px 8px;flex:0 0 auto}
  #foot{display:flex;flex-direction:row;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line);flex-wrap:nowrap;min-width:0}
  #foot .runwrap{min-width:0}
  #foot .runwrap .dd{min-width:0;max-width:130px}
  #foot .grow{flex:1 1 auto}
  .aiwrap{display:inline-flex;align-items:center;gap:6px;color:var(--dim)}
  .aiic{width:15px;height:15px;fill:none;stroke:#a78bfa;stroke-width:1.8;stroke-linejoin:round}
  #foot .aiseg{background:none;border-color:var(--line)}
  #foot .aiseg button{height:26px;padding:0 10px;font-size:12px;color:var(--dim)}
  #foot .aiseg button.on{background:var(--violet-soft);color:#d8ccff;margin:1px}
  .runwrap .dd{height:32px;border-radius:var(--r) 0 0 var(--r);border-inline-end:none;max-width:150px;background:transparent}
  #runAgent{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:0 var(--r) var(--r) 0;
            background:transparent;border-color:var(--line2);color:var(--fg)}
  #runAgent svg{width:12px;height:12px;fill:currentColor;stroke:none}
  #runAgent:hover:not(:disabled){background:var(--violet-soft);border-color:#a78bfa77}
  #copyAll{height:32px;padding:0 18px;border-radius:var(--r);font-weight:600}

  .modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;padding:24px;background:#05060899;
         backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .modal.show{display:flex}
  .mcard{display:flex;width:min(760px,100%);height:min(560px,calc(100vh - 48px));border-radius:16px;overflow:hidden;
         background:var(--panel);border:1px solid var(--line2);box-shadow:0 30px 80px #000a}
  .mtabs{flex:0 0 190px;display:flex;flex-direction:column;gap:2px;padding:18px 10px;background:var(--bg);border-inline-end:1px solid var(--line)}
  .mtitle{font:650 15px/1 inherit;padding:4px 10px 16px;color:var(--fg)}
  .mtabs button{justify-content:flex-start;text-align:start;height:34px;border:none;background:none;color:var(--dim);border-radius:8px;font-weight:520}
  .mtabs button:hover{background:var(--panel2);color:var(--fg)}
  .mtabs button.on{background:var(--panel2);color:var(--fg)}
  .mbody{position:relative;flex:1 1 auto;overflow:auto;padding:22px 26px}
  .mclose{position:absolute;top:12px;inset-inline-end:12px}
  .mbody section{display:none;flex-direction:column}
  .mbody section.on{display:flex}
  .mbody h3{margin:0 0 14px;font:650 16px/1.2 inherit}
  .mnote{margin:0 0 8px;color:var(--dim);font-size:12.5px}
  .mbody .srow{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
  .mbody .srow.col{flex-direction:column;align-items:stretch;gap:10px}
  .mbody .srow b{display:block;font-weight:560;font-size:13px}
  .mbody .srow small{display:block;margin-top:3px;color:var(--dim2);font-size:11.5px;line-height:1.5}
  .mbody label.srow{cursor:pointer}
  .mbody input[type=checkbox]{width:16px;height:16px;flex:0 0 auto}
  .keyrow{display:flex;gap:8px}
  .keyrow input{flex:1 1 auto;height:32px}
  #keylist .grow{padding:6px 0}
  @media (max-width: 640px){ .mcard{flex-direction:column;height:calc(100vh - 32px)} .mtabs{flex:0 0 auto;flex-direction:row;overflow:auto;padding:10px} .mtitle{display:none} }

  /* ================= light theme ================= */
  :root[data-theme="light"]{--bg:#f5f6f8;--panel:#ffffff;--panel2:#f1f3f6;--line:#e6e9ee;--line2:#d9dde4;--fg:#16181d;--dim:#5d6473;--dim2:#8b92a1;
    --violet-soft:#7c3aed14;color-scheme:light;
    --sidebar-bg:color-mix(in srgb, var(--bg), var(--fg) 4%)}
  :root[data-theme="dark"]{color-scheme:dark}
  [data-theme="light"] body{background:var(--bg)}
  [data-theme="light"] button:hover:not(:disabled){background:#eceff3;border-color:#cdd2da}
  [data-theme="light"] button.primary:hover:not(:disabled){background:#fb8a3c}
  [data-theme="light"] input{background:#fff}
  [data-theme="light"] .dd{background:#fff}
  [data-theme="light"] .dd:hover:not(:disabled){background:#f6f7f9;border-color:#c9ced7}
  [data-theme="light"] .ddm{background:#fff;box-shadow:0 14px 40px #0002,0 2px 8px #0001}
  [data-theme="light"] .ddm button:hover:not(:disabled), [data-theme="light"] .ddm button.on{background:#f1f3f6}
  [data-theme="light"] .dot{background:#c3c8d1}
  [data-theme="light"] #dock{background:#ffffffe6;box-shadow:0 8px 28px #0000001f}
  [data-theme="light"] #dock button.ghost{color:#555c6b}
  [data-theme="light"] #screen{box-shadow:0 12px 40px #0000002a}
  [data-theme="light"] .chip{background:#f973161a;border-color:#f9731666;color:#c2410c}
  [data-theme="light"] .chip.mark{background:#ef444414;border-color:#ef444466;color:#b91c1c}
  [data-theme="light"] .grow{color:#333845}
  [data-theme="light"] .grow kbd, [data-theme="light"] #guide h2{color:#6d28d9}
  [data-theme="light"] #guide h2{color:var(--fg)}
  [data-theme="light"] .gstate button.hot, [data-theme="light"] #foot .aiseg button.on{color:#5b21b6}
  [data-theme="light"] .prob.warn{background:#fef3c7;color:#92400e;border-color:#fcd34d88}
  [data-theme="light"] .prob.error{background:#fee2e2;color:#991b1b;border-color:#fca5a588}
  [data-theme="light"] .modal{background:#11141a55}
  [data-theme="light"] .mcard{box-shadow:0 30px 80px #0003}
  [data-theme="light"] #runAgent:hover:not(:disabled){background:#7c3aed12}
  [data-theme="light"] .side{box-shadow:-10px 0 30px #0002}
  [data-theme="light"] kbd{background:#f5f6f8}

  /* ================= editor actions follow the text; the side panel is the prompt list ================= */
  #edwrap{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
  #edscroll{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;cursor:text}
  #editor{flex:0 0 auto;overflow:visible;min-height:3.2em;padding:22px 26px 6px}
  #edact{position:sticky;bottom:0;z-index:2;display:flex;align-items:center;gap:2px;padding:4px 20px 14px;margin-top:0;
         background:linear-gradient(to top,var(--bg) 70%,transparent);cursor:default}
  #edact button{position:static;width:34px;height:34px;border-radius:50%;padding:0;background:none;border:none;color:var(--dim);display:inline-flex;align-items:center;justify-content:center}
  #edact button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  #edact #refine svg{stroke:#a78bfa}
  #edact button:hover:not(:disabled){background:var(--panel2);color:var(--fg)}
  /* Mic level meter: 5 thin bars beside the mic button, fed by the AnalyserNode startMeter()
     already runs on the recorder's own stream (no second getUserMedia). Height tracks the
     smoothed level continuously; colour flips to --rec only above SPEECH_LEVEL, the same
     threshold the dictation itself cuts a segment at a pause with. A `display` rule here has to
     beat the plain [hidden] one, same as #edact #tokest[hidden] below. */
  #vu{display:flex;align-items:flex-end;gap:2px;height:15px;padding:0 3px;margin-inline-end:1px}
  #vu[hidden]{display:none}
  #vu i{width:3px;border-radius:1px;background:var(--dim2);transition:height .05s linear,background .15s linear}
  #vu.loud i{background:var(--rec)}
  @media (prefers-reduced-motion: reduce){ #vu i{transition:none} }
  #edact #rec.on{background:var(--rec);color:#fff}
  body.collect #guide, body.use #guide, body.jem #guide{padding:0;gap:0}
  /* ---- history sidebar: a plain, quiet list — one "New prompt" row, hairline, grouped rows */
  .newprompt{display:flex;align-items:center;gap:9px;margin:8px 8px 0;padding:0 10px;height:38px;flex:0 0 auto;
             border:1px solid var(--line2);border-radius:9px;background:none;color:var(--fg);font:520 12.5px/1 inherit;justify-content:flex-start}
  .newprompt svg{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .newprompt:hover{background:var(--panel2)}
  #guide .sidediv{flex:0 0 1px;margin:10px 0 2px;background:var(--line)}
  #histlist{display:flex;flex-direction:column;gap:0;padding:0 8px 16px;overflow:auto}
  .hgrouplbl{padding:12px 8px 4px;font:650 10px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
  #histlist .hitem{display:flex;align-items:center;gap:6px;height:38px;min-height:38px;padding:0 8px;border:none;border-radius:8px;
       background:none;text-align:start;cursor:pointer;outline:none}
  #histlist .hitem:hover, #histlist .hitem:focus-visible{background:var(--panel2)}
  #histlist .hitem .p{flex:1 1 auto;min-width:0;font:450 12.5px/1.4 inherit;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #histlist .hitem .hcopy{flex:0 0 auto;width:26px;height:26px;padding:0;opacity:0;transition:opacity .1s}
  #histlist .hitem .hcopy svg{width:14px;height:14px}
  #histlist .hitem:hover .hcopy, #histlist .hitem:focus-within .hcopy{opacity:1}
  .hempty{flex:1 1 auto;display:flex;align-items:center;padding:0 16px;color:var(--dim2);font-size:12px}
  @media (max-width: 860px){ #guideOpen{display:none!important} }

  #runAgent{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 14px;border-radius:var(--r);background:transparent;border-color:var(--line2);color:var(--fg)}
  #runAgent[hidden]{display:none}
  #runAgent svg{width:11px;height:11px;fill:currentColor;stroke:none}
  .mbody .srow .dd{max-width:220px}

  #live{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:#000}

  /* ================= action row: copy and run as split icons ================= */
  #edact .sp{flex:1 1 auto}
  .splitbtn{position:relative;display:inline-flex;align-items:center}
  .splitbtn[hidden]{display:none}
  #edact .splitbtn .chev{width:16px;height:34px;border-radius:6px;margin-inline-start:-4px;opacity:0;transition:opacity .12s;color:var(--dim)}
  #edact .splitbtn .chev svg{width:12px;height:12px}
  #edact .splitbtn:hover .chev, #edact .splitbtn.open .chev, #edact .splitbtn .chev:focus-visible{opacity:1}
  #edact #copyAll{color:var(--fg)}
  #edact #copyAll.done, #edact #runAgent.done{background:var(--ok);color:#04231a}
  #edact #runAgent{color:#a78bfa}
  #pop{position:fixed;z-index:45;min-width:230px;max-width:300px;padding:6px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);
       box-shadow:0 14px 40px #000a;display:flex;flex-direction:column;gap:2px}
  #pop[hidden]{display:none}
  #pop .ph{padding:8px 10px 4px;font:600 11px/1 inherit;color:var(--dim2);letter-spacing:.02em}
  .ptog{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer}
  .ptog:hover{background:var(--panel2)}
  .ptog input{margin-top:2px}
  .ptog b{display:block;font:520 12.5px/1.3 inherit}
  .ptog small{display:block;color:var(--dim2);font-size:11px;line-height:1.45;margin-top:2px}
  .pitem{justify-content:flex-start;text-align:start;height:32px;border:none;background:none;border-radius:8px;color:var(--fg);font-weight:500}
  .pitem:hover{background:var(--panel2)}
  .pitem.on{background:var(--violet-soft);color:#d8ccff}
  [data-theme="light"] #pop{box-shadow:0 14px 40px #0002}
  [data-theme="light"] .pitem.on{color:#5b21b6}
  /* chip hover card: the same fields the click-to-copy puts on the clipboard */
  #chipcard{position:fixed;z-index:46;max-width:360px;padding:9px 11px;border-radius:10px;background:var(--panel);
            border:1px solid var(--line2);box-shadow:0 14px 40px #000a;pointer-events:none}
  #chipcard[hidden]{display:none}
  #chipcard .cchead{font:700 11.5px/1.3 var(--mono);color:var(--fg);margin-bottom:5px;direction:ltr;unicode-bidi:isolate}
  #chipcard .ccbody{margin:0;white-space:pre-wrap;word-break:break-word;color:var(--dim);font:11px/1.55 var(--mono);
                     direction:ltr;unicode-bidi:isolate;max-height:260px;overflow:auto}
  [data-theme="light"] #chipcard{box-shadow:0 14px 40px #0002}
  #topbar{position:relative}
  #guideOpen{position:absolute;inset-inline-start:0;top:50%;transform:translateY(-50%);display:none;width:30px;height:30px;border:none;border-radius:8px;background:none;color:var(--dim)}
  #guideOpen svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  #guideOpen:hover{background:var(--panel2);color:var(--fg)}
  body.guide-off #guideOpen{display:inline-flex}
  /* ============ text colours: typed white, dictated grey, anchors neutral (no orange/red) ============ */
  #editor{color:#fff}
  #editor .said{color:#a4a9b8}
  .chip,.chip.mark{background:#ffffff0d;border:1px solid #ffffff2b;color:#e4e6ec}
  .chip:hover,.chip.mark:hover{background:#ffffff1a;border-color:#ffffff59}
  [data-theme="light"] #editor{color:#0f1115}
  [data-theme="light"] #editor .said{color:#6b7280}
  [data-theme="light"] .chip,[data-theme="light"] .chip.mark{background:#0000000a;border-color:#00000024;color:#1f2937}
  [data-theme="light"] .chip:hover,[data-theme="light"] .chip.mark:hover{background:#00000014;border-color:#00000040}
  /* The AI edit: three small dots in place of the ✨ while it works, and the text locked (not
     covered) until the answer is in. */
  #refine .dots{display:none;gap:3px;align-items:center}
  #refine.busy svg{display:none}
  #refine.busy .dots{display:flex}
  #refine .dots i{width:4px;height:4px;border-radius:50%;background:#a78bfa;animation:dotpulse 1s ease-in-out infinite}
  #refine .dots i:nth-child(2){animation-delay:.15s}
  #refine .dots i:nth-child(3){animation-delay:.3s}
  @keyframes dotpulse{0%,80%,100%{opacity:.25;transform:scale(.75)}40%{opacity:1;transform:scale(1)}}
  #editor.locked{opacity:.55;cursor:progress;user-select:none}
</style>

// Copy/cut inside the editor: plain text gets each chip as "@label" plus the full reference
// blocks appended, so what leaves the editor is complete; a private payload carries the
// chips themselves, so pasting back INTO the editor re-materializes them as chips.
const CHIP_MIME = 'application/x-emu-composer-chips'
function selectionPayload() {
  const sel = getSelection(); if (!sel.rangeCount || sel.isCollapsed) return null
  const frag = sel.getRangeAt(0).cloneContents()
  const box = document.createElement('div'); box.appendChild(frag)
  const chips = [...box.querySelectorAll('.chip')].map(c => { const r = refOf(ed.querySelector(`[data-uid="${c.dataset.uid}"]`) || c); return r && { uid: c.dataset.uid, ...r } }).filter(Boolean)
  let plain = ''
  const walk = n => {
    if (n.nodeType === 3) return n.nodeValue
    if (n.nodeType !== 1) return ''
    if (n.classList.contains('chip')) { const r = refOf(ed.querySelector(`[data-uid="${n.dataset.uid}"]`) || n); return r ? `@${r.label}` : `@${n.textContent.replace(/^@/, '')}` }

    if (n.tagName === 'BR') return '\n'
    let out = /^(DIV|P)$/.test(n.tagName) && n.previousSibling ? '\n' : ''
    for (const c of n.childNodes) out += walk(c)
    return out
  }
  for (const c of box.childNodes) plain += walk(c)
  plain = plain.replace(/ /g, ' ')
  if (chips.length) plain += '\n\n' + chips.map(r => `### @${r.label}\n${r.block}`).join('\n\n')

function onCopyCut(e, cut) {

  if (cut) document.execCommand('delete')
  setStatus(p.chips.length ? t(cut ? 'st_cut_sel' : 'st_copied_sel', p.chips.length) : t(cut ? 'st_cut_plain' : 'st_copied_plain'), 'ok')
}

// Journal: a debounced snapshot of the editor once typing/dictation/paste/AI settle, so the log
// shows text growth without a line per keystroke. `via` is read here — synchronously, while
// execCommand is still unwinding — because by the time a MutationObserver callback would fire
// (always a microtask later) each call site below has already reset it back to 'typing'.
let editVia = 'typing', textEditTimer = null, lastLogChars = 0

  clearTimeout(textEditTimer)
  textEditTimer = setTimeout(() => {

    const marksN = ed.querySelectorAll('.chip.mark').length

// ----------------------------------------------------- assembling the text --
let orphans = 0
const PF_NAME = { ios: 'iOS', android: 'Android' }
// Enter in the text makes <div>…</div> lines, and an empty line is <div><br></div>: that <br>
// only holds the line open (the block already breaks), so the last <br> of a block adds no
// line — three Enters used to come out as five.
const brBreak = n => n.nextSibling || !/^(DIV|P)$/.test(n.parentNode?.tagName || '') ? '\n' : ''
function serialize() {
  const used = [], marks = []; orphans = 0
  const dual = platformsInEditor().size > 1
  // Two platforms: @ios1… and @android1… so the agent never confuses the two trees.
  const tagOf = u => dual ? `@${u.platform || 'ui'}${used.filter(x => (x.platform || '') === (u.platform || '')).indexOf(u) + 1}` : `@ui${used.indexOf(u) + 1}`
  const walk = n => {
    if (n.nodeType === 3) return n.nodeValue
    if (n.nodeType !== 1) return ''
    if (n.classList.contains('interim')) return ''
    if (n.classList.contains('chip')) {
      const r = refOf(n)
      if (!r) { orphans++; return `@${n.textContent.replace(/^@/, '')}` }
      if (r.kind === 'mark') { if (!marks.some(m => m.n === r.n)) marks.push(r); return `@mark${r.n}` }
      let i = used.findIndex(u => u.uid === n.dataset.uid)
      if (i < 0) { used.push({ uid: n.dataset.uid, ...r }); i = used.length - 1 }
      return tagOf(used[i])
    }
    let out = ''
    if (/^(DIV|P)$/.test(n.tagName) && n.previousSibling) out += '\n'
    if (n.tagName === 'BR') return brBreak(n)
    for (const c of n.childNodes) out += walk(c)
    return out
  }
  let body = ''
  for (const c of ed.childNodes) body += walk(c)
  body = body.replace(/ /g, ' ').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').replace(/ {2,}/g, ' ').trim()

  // A line of dashes separates items: each becomes its own numbered heading, so an agent
  // treats five asks as five, not as one paragraph to skim.
  const items = body.split(/\n\s*-{2,}\s*(?:\n|$)/).map(s => s.trim()).filter(Boolean)
  const L = items.length > 1
    ? [`# Task (${items.length} separate items — address each one)`, '', ...items.flatMap((s, i) => [`## ${i + 1}`, s, ''])]
    : ['# Task', body || '(no text)', '']
  if (dual) L.splice(1, 0, '(two platforms: @ios* elements were picked on the iOS Simulator, @android* on the Android emulator — the same screen on each)')
  const elementLines = list => list.forEach(u => L.push(`### ${tagOf(u)} — ${JSON.stringify(u.label)}${u.what ? `  (${u.what})` : ''}`, u.block, ''))
  if (used.length && dual) {
    L.push('# Elements', '')
    for (const pf of ['ios', 'android', '']) { const list = used.filter(u => (u.platform || '') === pf); if (list.length) { L.push(`## ${PF_NAME[pf] || 'Unknown device'}`, ''); elementLines(list) } }
  } else if (used.length) {
    L.push('# Elements', '')
    elementLines(used)
  }
  if (marks.length) {
    const files = [...new Set(marks.map(m => m.file).filter(Boolean))]
    L.push('# Marks', `Drawn by the user on the screenshot${files.length ? ` — open ${files.join(', ')} to see them; the number in each badge is the mark's number` : ''}.`, '')
    marks.sort((a, b) => a.n - b.n).forEach(m => L.push(`### @mark${m.n} — ${m.colorName} ${m.shape === 'rect' ? 'box' : m.shape}${dual && m.platform ? ` (${PF_NAME[m.platform]})` : ''}`, m.block + (m.file ? `\nimage:    ${m.file}` : ''), ''))
  }
  // Elements picked across several screens: say so, so the agent does not assume one.
  const screenLine = (c, list) => {
    const screens = [...new Set(list.map(u => u.screen).filter(Boolean))]
    if (screens.length > 1 || (screens.length === 1 && screens[0] !== c.screen)) L.push(`elements: picked on ${screens.length} screen${screens.length > 1 ? 's' : ''} — ${screens.join(' · ')}`)
  }
  if (dual) {
    for (const pf of ['ios', 'android']) {
      const c = screenCtx[pf]; if (!c) continue
      L.push(c.block.replace(/^# Screen/, `# Screen (${PF_NAME[pf]})`))
      screenLine(c, [...used, ...marks].filter(u => u.platform === pf))
      L.push('')
    }
  } else if (ctx) {
    L.push(ctx.block)
    screenLine(ctx, used)
    L.push('')
  }
  if ($('#optPath').checked && extras.path) L.push(extras.path, '')
  if ($('#optErrors').checked && extras.errors) L.push(extras.errors, '')
  if ($('#optNotes').checked && (dual ? notesBoth || notesText : notesText)) L.push(dual ? notesBoth || notesText : notesText, '')
  return { text: L.join('\n').trim() + '\n', used: [...used, ...marks], orphans }
}

// ------------------------------------------------------------ token estimate --
// A cheap, approximate count of what copy/run would actually send: the full serialized prompt
// (text + every chip's expanded block + marks), not just what's visible. Latin runs roughly
// 4 chars/token, Hebrew and other non-Latin scripts run denser, roughly 2.5 chars/token.
function estimateTokens(s) {
  if (!s) return 0
  let latin = 0, other = 0
  for (const ch of s) { if (ch.charCodeAt(0) < 128) latin++; else other++ }
  return Math.max(0, Math.round(latin / 4 + other / 2.5))
}
function fmtCount(n) {
  if (n < 1000) return String(n)
  const k = n / 1000
  return (k < 10 ? k.toFixed(1).replace(/\.0$/, '') : Math.round(k)) + 'k'
}
let tokEstTimer = null
function scheduleTokEst() { clearTimeout(tokEstTimer); tokEstTimer = setTimeout(updateTokEst, 150) }
function updateTokEst() {
  // The box itself is empty (no text, no chips) — show nothing, not a count for the boilerplate
  // serialize() would still emit (screen context, headings).
  if (!ed.textContent.trim() && !ed.querySelector('.chip')) { $('#tokest').hidden = true; return }
  // serialize() also writes the shared `orphans` counter that copy/run read right after their
  // own call — save and restore it so this periodic, read-only estimate can never race them.
  const savedOrphans = orphans
  const { text } = serialize()
  orphans = savedOrphans
  $('#tokest').hidden = false
  $('#tokest').textContent = t('tok_est', fmtCount(estimateTokens(text)))
}
// Covers typing, chip insertion and chip/mark removal in one place — every one of them mutates
// the editor's DOM, so nothing needs its own call site.
//
// Journal: chip_add/chip_remove and mark_add/mark_remove are detected the same way, by diffing
// the live chip uids against the last snapshot, rather than hooking insertRef/addMark/removeMark
// directly — backspace, cut, undo, newPrompt and a paste of a previously-copied chip all add or
// remove a chip without going through those functions, and refine re-inserts the same uids it
// started with, so it produces no spurious events here.
let chipSnapshot = new Map()
function snapshotChips() {
  const cur = new Map()
  for (const c of ed.querySelectorAll('.chip[data-uid]')) {
    const r = refOf(c)
    cur.set(c.dataset.uid, { mark: c.classList.contains('mark'), n: r?.n, label: r?.label || c.textContent.replace(/^@/, ''), platform: r?.platform || c.dataset.platform || '' })
  }
  return cur
}
function diffChips() {
  const cur = snapshotChips()
  for (const [uid, v] of cur) if (!chipSnapshot.has(uid)) {
    if (v.mark) uilog('mark_add', { n: v.n, kind: 'mark' }); else uilog('chip_add', { label: v.label, platform: v.platform })
  }
  for (const [uid, v] of chipSnapshot) if (!cur.has(uid)) {
    if (v.mark) uilog('mark_remove', { n: v.n, kind: 'mark' }); else uilog('chip_remove', { label: v.label, platform: v.platform })
  }
  chipSnapshot = cur
}
new MutationObserver(() => { scheduleTokEst(); diffChips() }).observe(ed, { childList: true, subtree: true, characterData: true })

  const marksN = used.filter(u => u.kind === 'mark').length

  if (orphans) setStatus(t('st_orphans', orphans), 'err')

function cropOf(n, pad = 8) {
  if (!img.naturalWidth || !still()) return ''
  const c = document.createElement('canvas')
  const x = Math.max(0, n.x * scale - pad), y = Math.max(0, n.y * scale - pad)
  const w = Math.min(img.naturalWidth - x, n.w * scale + pad * 2), h = Math.min(img.naturalHeight - y, n.h * scale + pad * 2)
  if (w <= 0 || h <= 0) return ''
  c.width = w; c.height = h
  c.getContext('2d').drawImage(img, x, y, w, h, 0, 0, w, h)
  return c.toDataURL('image/png')
}
function fullShot() {
  if (!img.naturalWidth) return ''
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight
  c.getContext('2d').drawImage(img, 0, 0)
  return c.toDataURL('image/jpeg', 0.85)
}

function saveDraft() {

// ------------------------------------------------------------- dictation ----
// Speech, typing, Enter and anchors interleave in the order they happened. A segment drops an
// interim marker at the caret the moment speech starts, and its transcript later replaces that
// marker. Any act in the text while it holds speech — an anchor or a mark, a typed key, Enter,
// a paste — closes it on the spot (segBreak), so what was said before the act lands before it
// and what is said after opens a new marker after it: "this element @chip should move down",
// or a few Enters and then more speech a few lines lower. Otherwise segments are cut at
// PAUSES (~450 ms of silence), never mid-syllable, with a hard cap for a monologue. The next
// recorder starts BEFORE the previous one stops, so no word falls into the gap.
let mediaRec = null, recOn = false, audioCtx = null, stream = null
let seg = null, segN = 0, lastTranscript = ''
let recStartAt = 0, segCutCount = 0
const SEG_MIN_MS = 1200, SEG_MAX_MS = 15000, SILENCE_MS = 450, SPEECH_LEVEL = 0.06
// The level meter beside the mic button: 5 bars, tallest in the middle — a glance-readable
// level, not a spectrum (there is only one RMS number, not per-band data).
const vuBars = [...document.querySelectorAll('#vu i')]
const VU_MAX = [5, 9, 13, 9, 5]

async function toggleRec() {
  if (recOn) return stopRec()
  if (textLocked()) return
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
  } catch (e) { return setStatus(t('st_mic', e.message), 'err') }
  recOn = true; recStartAt = Date.now(); segCutCount = 0
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(mt => MediaRecorder.isTypeSupported(mt)) || ''
  const track = stream.getAudioTracks()[0]
  uilog('rec', { on: true })
  uilog('rec_start', { mimeType: mime, sampleRate: track?.getSettings?.().sampleRate || null, deviceLabel: track?.label || '',
    speechLevel: SPEECH_LEVEL, silenceMs: SILENCE_MS, segMinMs: SEG_MIN_MS, segMaxMs: SEG_MAX_MS })
  $('#rec').classList.add('on'); $('#vu').hidden = false; recTitle(); renderGuide()
  setStatus(t('st_rec_hint'), 'busy')
  startMeter()
  startSegment(mime)
}
function startSegment(mime) {
  if (!recOn) return
  const m = mime || ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(mt => MediaRecorder.isTypeSupported(mt)) || ''
  const rec = mediaRec = new MediaRecorder(stream, m ? { mimeType: m } : undefined)
  const s = seg = { n: ++segN, t0: Date.now(), lastLoud: Date.now(), hadSpeech: false, marker: null, rec, peak: 0, rmsSum: 0, rmsCount: 0, durMs: 0 }
  rec.ondataavailable = ev => {
    if (s.hadSpeech && ev.data.size > 1000) sendSegment(ev.data, s)
    else { uilog('seg_skip', { segIdx: s.n, bytes: ev.data.size }); s.marker?.remove() }
  }
  rec.onstop = () => { if (!recOn && seg === s) stream?.getTracks().forEach(t => t.stop()) }
  rec.start()
}
// The marker goes in when speech starts, not when the segment is cut: an anchor, a key or an
// Enter that comes while talking then lands after the words that led up to it.
function placeSegMarker(s) {
  const back = document.activeElement === $('#screen') ? $('#screen') : null   // use mode: the keyboard stays on the device
  restoreCaret()
  document.execCommand('insertHTML', false, `<span class="interim" data-seg="${s.n}">&#8203;</span>`)
  s.marker = ed.querySelector(`.interim[data-seg="${s.n}"]`)

}
function cutSegment(reason = 'pause') {

  s.durMs = Date.now() - s.t0
  segCutCount++
  uilog('seg_cut', { segIdx: s.n, durMs: s.durMs, reason, speech: s.hadSpeech, peak: +s.peak.toFixed(3), avgRms: +(s.rmsCount ? s.rmsSum / s.rmsCount : 0).toFixed(3) })
  if (s.hadSpeech && !s.marker) placeSegMarker(s)   // (a safety net: normally placed at onset)

}
// An act in the text while the open segment holds speech closes it here, before the act lands.
function segBreak(why) {

  uilog('seg-break', { why, ms: Date.now() - seg.t0 })

}
function stopRec() {

  uilog('rec_stop', { durMs: Date.now() - recStartAt, segments: segCutCount })
  $('#rec').classList.remove('on'); $('#rec').style.setProperty('--lv', 0); recTitle(); renderGuide()
  $('#vu').hidden = true; $('#vu').classList.remove('loud'); for (const b of vuBars) b.style.height = ''

function startMeter() {
  audioCtx = new AudioContext()
  const src = audioCtx.createMediaStreamSource(stream)
  const an = audioCtx.createAnalyser(); an.fftSize = 1024; src.connect(an)
  const buf = new Float32Array(an.fftSize)
  let smoothed = 0, windowPeak = 0, lastLevelAt = Date.now()
  const tick = () => {
    if (!recOn) return
    an.getFloatTimeDomainData(buf)
    let sum = 0; for (const v of buf) sum += v * v
    const rms = Math.sqrt(sum / buf.length)
    $('#rec').style.setProperty('--lv', Math.min(1, rms / 0.25).toFixed(3))
    // The meter's own smoothing (for the bars) is separate from the raw `rms` the pause/speech
    // detection below reads — that threshold must stay exactly as sensitive as it always was.
    smoothed = smoothed * 0.7 + Math.min(1, rms / 0.25) * 0.3
    const loud = rms > SPEECH_LEVEL
    $('#vu').classList.toggle('loud', loud)
    for (let i = 0; i < vuBars.length; i++) vuBars[i].style.height = (2 + (VU_MAX[i] - 2) * smoothed).toFixed(1) + 'px'
    const now = Date.now()
    if (seg) {
      seg.peak = Math.max(seg.peak, rms); seg.rmsSum += rms; seg.rmsCount++
      if (loud) { if (!seg.hadSpeech) placeSegMarker(seg); seg.lastLoud = now; seg.hadSpeech = true }
      const len = now - seg.t0, quiet = now - seg.lastLoud
      if ((seg.hadSpeech && len > SEG_MIN_MS && quiet > SILENCE_MS) || len > SEG_MAX_MS) cutSegment(len > SEG_MAX_MS ? 'max' : 'pause')
    }
    windowPeak = Math.max(windowPeak, rms)
    if (now - lastLevelAt >= 1000) {   // a compact level sample, at most once a second
      uilog('rec_level', { rms: +rms.toFixed(3), peak: +windowPeak.toFixed(3), silent: windowPeak <= SPEECH_LEVEL })

    }

  }

}
async function sendSegment(blob, s) {
  const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.readAsDataURL(blob) })
  uilog('seg_sent', { segIdx: s.n, bytes: blob.size, durMs: s.durMs })
  const tSend = Date.now()
  try {
    const d = await (await fetch('/api/transcribe', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ audio: b64, mime: blob.type, language: sttOverride ?? sttLanguage, prompt: lastTranscript, model: modelFor('stt') }) })).json()
    const ms = Date.now() - tSend
    if (d.error) { uilog('seg_error', { segIdx: s.n, ms, message: String(d.error).slice(0, 200) }); setStatus(d.error, 'err'); if (/OpenAI key/.test(d.error)) stopRec(); s.marker?.remove(); return }
    const t = (d.text || '').trim()
    if (!t) { uilog('seg_empty', { segIdx: s.n, ms }); s.marker?.remove(); return }
    uilog('seg_result', { segIdx: s.n, ms, chars: t.length, preview: t.slice(0, 60) })
    lastTranscript = (lastTranscript + ' ' + t).slice(-600)
    uilog('transcript', { text: t, ms: Date.now() - s.t0 })

    placeTranscript(s.marker, t, s.broken)

  } catch (e) { uilog('seg_error', { segIdx: s.n, ms: Date.now() - tSend, message: String(e.message || e).slice(0, 200) }); setStatus(t('st_stt_fail', e.message), 'err'); s.marker?.remove() }
}
// Replace the marker through the selection so the insert is undoable, then put the user's
// caret back where it was.
function placeTranscript(marker, text, broken = false) {
  const s = getSelection()
  const userRange = s.rangeCount && ed.contains(s.anchorNode) ? s.getRangeAt(0).cloneRange() : null
  const back = document.activeElement === $('#screen') ? $('#screen') : null
  ed.focus({ preventScroll: true })
  // The marker loses its spinner look first, then the text is typed over it: typed over as it
  // was, it copied the spinner's transparent colour and every transcript came out invisible;
  // removed first, it left an empty line with no height and the text jumped a line up.
  if (marker && ed.contains(marker)) {

  // Dictated words are grey, typed ones white: the transcript goes in as a .said span (the
  // space after it stays outside, so typing on from there is white again).
  editVia = 'dictation'
  document.execCommand('insertHTML', false, (prev && !/\s/.test(prev) ? ' ' : '') + `<span class="said">${escapeHTML(text)}</span> `)

  if (userRange && !(marker && userRange.intersectsNode?.(marker))) { try { s.removeAllRanges(); s.addRange(userRange) } catch {} }

function tokenizeEditor() {
  const chips = [], legend = []
  const walk = n => {
    if (n.nodeType === 3) return n.nodeValue
    if (n.nodeType !== 1 || n.classList.contains('interim')) return ''
    if (n.tagName === 'BR') return brBreak(n)
    if (n.classList.contains('chip')) {
      const r = refOf(n); chips.push(n.outerHTML); const k = chips.length
      legend.push(`⟦${k}⟧ = ` + (!r ? `"${n.textContent}"`
        : r.kind === 'mark' ? `mark ${r.n} — ${(r.block || '').split('\n').map(l => l.replace(/^\w+:\s+/, '')).join('; ')}${capImages.has(r.captureId) ? ` (badge ${r.n} in the attached screenshot of "${r.screen || '?'}")` : ''}`
        : `${r.what || 'element'} "${r.label}" on the screen "${r.screen || '?'}"${r.platform ? ` (${r.platform})` : ''}`))
      return `⟦${k}⟧`
    }
    let out = /^(DIV|P)$/.test(n.tagName) && n.previousSibling ? '\n' : ''
    for (const c of n.childNodes) out += walk(c)
    return out
  }
  let text = ''
  for (const c of ed.childNodes) text += walk(c)
  return { text: text.replace(/\u00a0/g, ' ').trim(), chips, legend: legend.join('\n') }
}
// One image per screen that holds marks in the text, marks burned in, downscaled for the model.
async function markImages() {
  const byCap = new Map()
  for (const m of allMarks()) { if (!byCap.has(m.captureId)) byCap.set(m.captureId, []); byCap.get(m.captureId).push(m) }
  const out = []
  for (const [id, ms] of [...byCap].slice(-4)) {
    const c = await burnMarks(id, ms, 720)
    if (c) out.push({ screen: ms[0].screen || '', marks: ms.map(m => m.n), url: c.toDataURL('image/jpeg', 0.82) })
  }
  return out
}

async function refineText(level = aiLevel) {

  const { text, chips, legend } = tokenizeEditor()
  if (!text.replace(/⟦\d+⟧/g, '').trim()) return setStatus(t('st_refine_empty'), 'err')
  // The text is locked while the AI works — its answer replaces all of it, so anything added
  // meanwhile would be lost. Anchors, marks and transcripts wait (see textLocked).
  refining = true; $('#refine').classList.add('busy'); uilog('refine', { level })

  try {
    const d = await (await fetch('/api/refine', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, level, legend, language: sttOverride ?? sttLanguage, images: await markImages(), model: modelFor(level) }) })).json()
    if (d.error) throw new Error(d.error)

// ----------------------------------------------------------------- layout ---
// Three columns in every mode — guide | device | text — with the device in the middle. The

// fitted to the space its column actually has (no fixed pixel budget), and every change of
// that space re-lays the overlay and the marks.
const DEF_GW = 290, DEF_RW = 460
function applyWidths() {

}

    e.preventDefault(); sp.setPointerCapture(e.pointerId); sp.classList.add('dragging'); document.body.classList.add('resizing')

        const w = ev.clientX - $('#guide').getBoundingClientRect().left
        if (w < 150) { document.body.classList.add('guide-off'); return }
        document.body.classList.remove('guide-off')

// The screen takes the largest size its column allows, keeping the device's aspect, with
// room left on both sides for the dock so the device stays centred.
function fitScreen() {
  const st = $('#stage'); if (!img.naturalWidth || !st.clientWidth) return
  // A vertical dock takes width on both sides (the device stays centred); a horizontal one
  // (narrow screens) takes height below.
  const d = $('#dock'), vertical = d.offsetHeight >= d.offsetWidth
  const W = Math.max(120, st.clientWidth - (vertical ? 2 * ((d.offsetWidth || 44) + 18) : 16))
  const H = Math.max(160, st.clientHeight - (vertical ? 16 : d.offsetHeight + 22))
  const ar = img.naturalWidth / img.naturalHeight
  let h = H, w = h * ar
  if (w > W) { w = W; h = w / ar }
  img.style.width = Math.floor(w) + 'px'; img.style.height = Math.floor(h) + 'px'
  if (still()) { drawOverlay(hotIdx); renderMarks() }
  placeDock()
}

// The dock (drawing tools + device keys) floats in the device column. Its default spot is

// so it survives resizes), always clamped inside the column.
let dockPos = null

  const st = $('#stage'), d = $('#dock'), sr = st.getBoundingClientRect()
  let x, y
  if (dockPos) { x = dockPos.fx * sr.width; y = dockPos.fy * sr.height }
  else {
    const r = $('#screen').getBoundingClientRect()
    if (d.offsetHeight >= d.offsetWidth) { x = r.left - sr.left - d.offsetWidth - 14; y = r.top - sr.top + (r.height - d.offsetHeight) / 2; if (x < 6) x = 6 }
    else { x = (sr.width - d.offsetWidth) / 2; y = r.bottom - sr.top + 8 }
  }

// ---------------------------------------------------------------- startup ---
// ONE table: the keydown handler reads it and the jem guide renders it, so the explanation
// on screen can never drift from what the keys actually do. `k` is the physical key
// (e.code), so the shortcuts work with a Hebrew layout too.
const SHORTCUTS = [
  { keys: '⌘J', t: 'sc_jem', k: 'KeyJ', run: () => setMode(mode === 'jem' ? plainMode : 'jem') },
  { keys: '⌘E', t: 'sc_mode', k: 'KeyE', run: () => setMode(mode === 'collect' ? 'use' : 'collect') },
  { keys: '⌘⇧R', t: 'sc_rec', k: 'KeyR', shift: true, run: () => toggleRec() },
  { keys: '⌘K', t: 'sc_kbd', k: 'KeyK', jem: true, run: () => setKbdApp(!kbdApp) },
  { keys: '⌘D', t: 'sc_draw', k: 'KeyD', still: true, run: () => setTool(TOOLS[(TOOLS.indexOf(tool) + 1) % TOOLS.length]) },
  { keys: '⌘B', t: 'sc_back', k: 'KeyB', run: () => deviceKey(4) },
  { keys: '⌘⇧H', t: 'sc_home', k: 'KeyH', shift: true, run: () => deviceKey(3) },
  { keys: '⌘⇧E', t: 'sc_refine', k: 'KeyE', shift: true, run: () => refineText() },
  { keys: '⌘↩', t: 'sc_copy', k: 'Enter', run: () => $('#copyAll').click() },
  { keys: '⌘⇧↩', t: 'sc_run', k: 'Enter', shift: true, run: () => $('#runAgent').click() },
  { keys: 'Esc', t: 'sc_esc', display: true },
]
const MOUSE = [['click', 'ms_tap'], ['⇧ click', 'ms_taponly'], ['⌘ click · right', 'ms_ref'], ['drag', 'ms_swipe'], ['wheel', 'ms_scroll'], ['hover', 'ms_hover'], ['⌥', 'ms_raw']]
const TOOLS = ['pick', 'pen', 'rect', 'arrow']
const shortcutFor = e => (e.metaKey || e.ctrlKey) && SHORTCUTS.find(s => !s.display && s.k === e.code && Boolean(s.shift) === e.shiftKey
  && (!s.jem || mode === 'jem') && (!s.still || still()))
async function deviceKey(code) { await input({ type: 'key', code }); if (still()) recaptureSoon(550) }

// Jem's keyboard has two targets: the text (default) or the app. ⌘K flips it, Esc returns.

    else if (e.key.length === 1) typeChar(e.key)

function onEscape() {

// ---- devices: several emulators may run; the page decides which one is mirrored.
let deviceSig = '', wantedOnce = false, lastDevices = [], lastActiveDevice = ''
// A device's dot: green = the active project's app is installed on it; grey = it is not.
function renderDevices(devices, active) {
  lastDevices = devices; lastActiveDevice = active
  const sel = $('#device')
  const usable = devices.filter(d => d.state === 'device')
  const has = new Set(projectsCache.find(p => p.id === activeProject)?.devices || [])
  const sig = usable.map(d => d.serial + d.avd + has.has(d.serial)).join('|') + '#' + active
  if (sig === deviceSig) return
  deviceSig = sig
  sel.innerHTML = usable.length
    ? usable.map(d => `<option value="${d.serial}"${d.serial === active ? ' selected' : ''} data-dot="${has.has(d.serial) ? 'on' : 'off'}" data-label="${escapeHTML(d.avd || d.model || d.serial)}" data-sub="${escapeHTML([d.headless ? t('headless') : '', d.avd || d.model ? d.serial : ''].filter(Boolean).join(' · '))}">${escapeHTML((d.avd || d.model || d.serial) + (d.headless ? ` · ${t('headless')}` : '') + (d.avd || d.model ? ` · ${d.serial}` : ''))}</option>`).join('')
    : `<option value="">${escapeHTML(t('device_none'))}</option>`

// ---- projects: one daemon serves them all; the switch is BY HAND, never guessed. The

// prompt names, so it is a deliberate choice, like the device.
let projectSig = '', activeProject = '', projectsCache = []
// A project's dot: green = its app is installed on at least one open emulator/simulator.
function renderProjects(list, active) {
  const sel = $('#project')
  projectsCache = list
  const sig = list.map(p => p.id + (p.devices || []).join(',')).join('|') + '#' + active

  projectSig = sig

    ? list.map(p => `<option value="${escapeHTML(p.id)}"${p.id === active ? ' selected' : ''} data-dot="${(p.devices || []).length ? 'on' : 'off'}" data-label="${escapeHTML(p.name)}" data-sub="${escapeHTML(t('proj_devices', (p.devices || []).length))}">${escapeHTML(p.name)}</option>`).join('')
    : `<option value="">${escapeHTML(t('project_none'))}</option>`

// Server-sent events: device list / active device / agent state arrive the moment they
// change (adb track-devices behind it), in either mode. Falls back to the health poll.
let sse = null, activeSerial = '', clientId = '', lastHash = ''
function connectEvents() {
  try { sse?.close() } catch {}

  sse.onmessage = async e => {
    const ev = JSON.parse(e.data)
    if (ev.type === 'screen') {
      // The device's UI tree changed under a still capture (the user drove the emulator
      // window itself). Re-capture — unless a drawing is in progress or the tab is hidden.
      if (!MODES[mode].watch || ev.hash === lastHash) return
      if (drawing || document.hidden) { pendingCapture = true; return }
      // Jem: a screen you drew on stays put — an animation must not wipe the drawing away.
      // It moves on when you act on the device (tap, swipe, key) or press refresh.
      if (mode === 'jem' && allMarks().some(m => m.captureId === captureId)) { setStatus(t('st_marks_hold'), 'ok'); return }
      await capture(); setStatus(t('st_screen_changed'), 'ok')
    } else if (ev.type === 'device') {
      if (ev.client) clientId = ev.client
      renderDevices(ev.devices || [], ev.serial || '')
      if (ev.projects) renderProjects(ev.projects, ev.active || '')
      if (ev.serial !== activeSerial) {
        activeSerial = ev.serial
        if (!ev.serial) { markLost(t('st_no_device')); return }
        markAlive(); nodes = []; captureId = 0; drawOverlay()
        for (const c of ed.querySelectorAll('.chip')) c.classList.add('stale')
        // No "connected to X" here: the device dropdown + its dot already say so.
        liveStop(); Live.failed = false; Live.touch = false
        if (still()) capture()
        if (mode === 'jem') liveStart(false)
        else if (mode === 'use') liveStart(true) || pumpFrames()
      }

    } else if (ev.type === 'agent') {
      const p = $('#agentpill'); p.className = 'pill ' + (ev.ready ? 'on' : 'bad')
      if (ev.ready && still() && !nodes.length) capture()
    }
  }
  sse.onerror = () => { setTimeout(connectEvents, 3000) }
}

$('#device').addEventListener('change', async e => {
  const serial = e.target.value; if (!serial) return
  setStatus(t('st_switching', serial), 'busy')
  try {
    const d = await (await fetch('/api/device', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ serial }) })).json()

    // No confirmation text either: the dropdown now shows `serial` selected, dot and all.
    setStatus('', '')
  } catch (err) { setStatus(err.message, 'err') }
})
