<!doctype html>
<meta charset="utf-8">
<title>emu-composer</title>
<style>
  :root{
    --bg:#0d0e13; --panel:#14161d; --panel2:#1b1e27; --line:#262a36; --line2:#333949;
    --fg:#e7e9f0; --dim:#868da3; --dim2:#5d6478;
    --accent:#f97316; --accent-fg:#140b03; --accent2:#38bdf8; --ok:#34d399; --bad:#f87171; --warn:#fbbf24; --rec:#ef4444;
    --r:4px; --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);height:100vh;overflow:hidden;display:flex;
       font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .lbl{font:600 10px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--dim2)}
  kbd{font:500 10px/1 var(--mono);color:var(--dim);border:1px solid var(--line2);border-radius:3px;padding:2px 4px;margin-inline-start:6px}

  button{background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:var(--r);
         padding:6px 12px;font:550 12px/1.35 inherit;cursor:pointer;transition:background .12s,border-color .12s;white-space:nowrap}
  button:hover:not(:disabled){background:#252936;border-color:#454c62}
  button:active:not(:disabled){background:#2c3140}
  button:disabled{opacity:.35;cursor:default}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:650}
  button.primary:hover:not(:disabled){background:#fb8a3c;border-color:#fb8a3c}
  button.primary.done{background:var(--ok);border-color:var(--ok);color:#04231a;transform:scale(1.03)}
  button.primary.fail{background:var(--bad);border-color:var(--bad);color:#fff}
  button.primary{transition:background .15s,border-color .15s,transform .15s}
  button.ghost{background:none;border-color:transparent;color:var(--dim)}
  button.ghost:hover:not(:disabled){background:var(--panel2);color:var(--fg)}
  input{background:#0a0b0f;color:var(--fg);border:1px solid var(--line2);border-radius:var(--r);padding:6px 9px;font:12px/1.4 var(--mono);outline:none}
  input:focus{border-color:var(--accent2)}
  select{background:var(--panel2);color:var(--fg);border:1px solid var(--line2);border-radius:var(--r);padding:5px 8px;font:550 11.5px/1.3 var(--mono);max-width:210px;outline:none;cursor:pointer}
  select:focus{border-color:var(--accent2)}
  select.bad{color:var(--bad);border-color:#5c2a2a}
  .seg{display:flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden;flex:0 0 auto}
  .seg button{border:none;border-radius:0;background:var(--panel);color:var(--dim);padding:6px 13px}
  .seg button + button{border-inline-start:1px solid var(--line2)}
  .seg button.on{background:var(--accent);color:var(--accent-fg);font-weight:650}
  .seg button.on.alt{background:var(--accent2);color:#04202b}
  .pill{font:600 10px/1 var(--mono);letter-spacing:.06em;padding:4px 7px;border-radius:3px;border:1px solid var(--line2);color:var(--dim2)}
  .pill.on{color:var(--ok);border-color:#1f5c48}
  .pill.bad{color:var(--bad);border-color:#5c2a2a}

  /* ================= emulator column ================= */
  #left{flex:0 0 auto;display:flex;flex-direction:column;gap:10px;padding:12px;border-inline-end:1px solid var(--line);background:var(--panel)}
  .bar{display:flex;align-items:center;gap:8px}
  #modehint{color:var(--dim2);font-size:11px;margin-inline-start:auto;text-align:end;max-width:220px;line-height:1.35}
  #screen{position:relative;line-height:0;overflow:hidden;border:1px solid var(--line2);background:#000;align-self:center;outline:none}
  body.collect #screen{border-color:var(--accent);cursor:crosshair}
  body.use #screen{border-color:var(--accent2)}
  body.use #screen:focus{box-shadow:0 0 0 1px var(--accent2)}
  #shot{display:block;max-height:calc(100vh - 176px);width:auto;user-select:none;-webkit-user-drag:none}
  #ov{position:absolute;inset:0}
  #marks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  #marks .hl{filter:drop-shadow(0 0 3px #fff)}
  #tools{display:none;min-height:30px}
  body.collect #tools{display:flex}
  #tools .seg button{padding:5px 10px;font-size:11px}
  #colors{display:flex;gap:5px;align-items:center}
  .sw{width:16px;height:16px;border-radius:50%;border:2px solid transparent;padding:0;background:var(--c);cursor:pointer}
  .sw.on{border-color:#fff}
  .chip.mark{background:#ef444418;border-color:#ef444470;color:#fca5a5}
  .chip.mark:hover{background:#ef444436;border-color:#ef4444}
  .box{position:absolute;border:1px solid transparent;pointer-events:none}
  .box.hot{border-color:var(--accent2);background:#38bdf81c;box-shadow:0 0 0 1px #0009 inset}
  .box.pick{border-color:var(--accent);background:#f9731626}
  .tag{position:absolute;top:0;inset-inline-start:0;transform:translateY(-100%);background:var(--accent2);color:#04202b;
       font:700 10px/1.6 var(--mono);padding:0 5px;white-space:nowrap;max-width:240px;overflow:hidden;text-overflow:ellipsis;direction:ltr}
  .box.pick .tag{background:var(--accent);color:var(--accent-fg)}
  .box.flip .tag{top:auto;bottom:0;transform:translateY(100%)}
  #busy{position:absolute;inset-inline-end:8px;top:8px;font:600 10px/1 var(--mono);color:var(--accent2);background:#0009;padding:4px 6px;display:none}
  #busy.show{display:block}
  #lost{position:absolute;inset:0;background:#000c;color:var(--bad);display:none;align-items:center;justify-content:center;
        font:600 12px/1.5 var(--mono);text-align:center;padding:20px}
  #lost.show{display:flex}
  #navbar{display:flex;gap:5px;justify-content:center}
  #navbar button{padding:5px 12px;font-size:11px;font-family:var(--mono)}

  /* ================= composer column ================= */
  #right{flex:1 1 auto;min-width:430px;display:flex;flex-direction:column;overflow:hidden}
  .row{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  #rec{display:flex;align-items:center;gap:7px}
  #rec.on{background:var(--rec);border-color:var(--rec);color:#fff}
  #dot{width:7px;height:7px;background:currentColor;opacity:.5}
  #rec.on #dot{animation:pulse .9s infinite}
  @keyframes pulse{50%{opacity:.12}}
  #level{width:46px;height:3px;background:#ffffff33;overflow:hidden;display:none}
  #rec.on #level{display:block}
  #level i{display:block;height:100%;width:0;background:#fff;transition:width .07s}
  #status{margin-inline-start:auto;color:var(--dim);font-size:11.5px;text-align:end;flex:0 1 auto;min-width:0;max-width:340px;
          font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #status.busy{color:var(--accent2)} #status.err{color:var(--bad)} #status.ok{color:var(--ok)}

  #editor{flex:1 1 auto;overflow:auto;padding:18px 20px;font-size:14.5px;line-height:1.8;outline:none;white-space:pre-wrap;word-break:break-word;caret-color:var(--accent)}
  #editor:empty::before{content:attr(data-ph);color:var(--dim2);font-size:13px}
  /* An INLINE box (not inline-block): its background hugs the glyphs, so it sits on the
     sentence's baseline at the sentence's size instead of floating above it. */
  .chip{display:inline;background:#f973161f;border:1px solid #f9731670;color:#fdba74;border-radius:3px;padding:1px 6px;margin:0 1px;
        font:600 0.9em/1 var(--mono);cursor:pointer;user-select:none;direction:ltr;unicode-bidi:isolate;white-space:nowrap;
        -webkit-box-decoration-break:clone;box-decoration-break:clone;vertical-align:baseline}
  .chip:hover{background:#f9731636;border-color:var(--accent)}
  .chip.flash{background:var(--ok);border-color:var(--ok);color:#04231a}
  .chip.stale{border-style:dashed;opacity:.8}
  .chip b{opacity:.6;font-weight:700}
  #editor.dual .chip[data-platform="ios"] bdi::before{content:"iOS · ";opacity:.65;font-size:.85em}
  #editor.dual .chip[data-platform="android"] bdi::before{content:"Android · ";opacity:.65;font-size:.85em}
  .interim{color:var(--accent2);opacity:.7;border-bottom:1px dotted var(--accent2)}

  #keyrow{display:none;gap:8px;align-items:center;background:#171213;border-bottom:1px solid #3a2a20}
  #keyrow.show{display:flex}
  #apikey{flex:1 1 auto;min-width:200px}
  #warn{display:none;width:100%;color:var(--warn);font-size:11.5px;font-family:var(--mono)}
  #warn.show{display:block}
  #ctx{margin-inline-start:auto;color:var(--dim2);font:11px/1.5 var(--mono);text-align:end;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:55%}
  label.opt{display:flex;align-items:center;gap:5px;color:var(--dim);font-size:11.5px;cursor:pointer;user-select:none}

  /* history panel */
  .side{position:absolute;inset-inline-end:0;top:0;bottom:0;width:min(520px,60vw);background:var(--panel);border-inline-start:1px solid var(--line2);
        display:none;flex-direction:column;z-index:5;box-shadow:-10px 0 30px #0008}
  .side.show{display:flex}
  .sbody{padding:8px 14px;overflow:auto}
  .srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:12.5px}
  .snote{color:var(--dim2);font-size:11px;padding:8px 0 4px}
  #hist .row{justify-content:space-between}
  #histlist{overflow:auto;flex:1 1 auto}
  .hitem{padding:10px 13px;border-bottom:1px solid var(--line);cursor:pointer}
  .hitem:hover{background:var(--panel2)}
  .hitem .t{font:500 10.5px/1 var(--mono);color:var(--dim2);margin-bottom:4px}
  .hitem .p{font-size:12.5px;color:var(--fg);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  #right{position:relative}
  #problems{display:none;flex-direction:column;gap:1px;background:var(--line)}
  #problems.on{display:flex}
  .prob{display:flex;align-items:center;gap:8px;padding:7px 12px;font-size:12px;background:var(--panel2)}
  .prob.error{background:#3a1414;color:#ffb4b4}
  .prob.warn{background:#3a2c12;color:#ffd9a0}
  .prob.info{background:var(--panel2);color:var(--dim2)}
  .prob b{font-weight:600}
  .prob button{font-size:11px;padding:2px 8px;margin-inline-start:auto;white-space:nowrap}
  .cnt{font:600 10px/1 var(--mono);color:var(--dim2);margin-inline-start:4px}
  .cnt.has{color:#ffb4b4}
  #project{max-width:150px}
</style>

<div id="left">
  <div class="bar">
    <div class="seg">
      <button id="mCollect" class="on" data-t="mode_collect">איסוף</button>
      <button id="mUse" class="alt" data-t="mode_use">שימוש</button>
    </div>
    <kbd>⌘E</kbd>
    <select id="project" data-t-title="project_title"></select>
    <select id="device" data-t-title="device_title"></select>
    <span id="modehint"></span>
  </div>
  <div id="problems"></div>
  <div class="bar" id="tools">
    <div class="seg" id="toolseg">
      <button data-tool="pick" class="on" data-t="tool_pick">בחירה</button><button data-tool="pen" data-t="tool_pen">עט</button>
      <button data-tool="rect" data-t="tool_rect">מסגרת</button><button data-tool="arrow" data-t="tool_arrow">חץ</button>
    </div>
    <span id="colors">
      <button class="sw on" data-c="#ef4444" style="--c:#ef4444" title="red"></button>
      <button class="sw" data-c="#facc15" style="--c:#facc15" title="yellow"></button>
      <button class="sw" data-c="#3b82f6" style="--c:#3b82f6" title="blue"></button>
    </span>
    <button id="undoMark" class="ghost" data-t="undo_mark">בטל סימון</button>
  </div>
  <div id="screen" tabindex="0"><img id="shot" alt="" draggable="false"><div id="ov"></div><svg id="marks" xmlns="http://www.w3.org/2000/svg"></svg><span id="busy">…</span><div id="lost"></div></div>
  <div id="navbar">
    <button data-key="4">‹ BACK</button><button data-key="3">HOME</button>
    <button data-key="187">RECENTS</button><button id="recap">↻ REFRESH</button>
    <span id="agentpill" class="pill" title="on-device agent">AGENT</span>
  </div>
</div>

<div id="right">
  <div class="row">
    <span class="lbl" data-t="prompt">Prompt</span>
    <button id="rec"><span id="dot"></span><span id="reclabel" data-t="rec">הקלטה</span><span id="level"><i></i></span></button>
    <button id="histbtn" class="ghost" data-t="history">היסטוריה</button>
    <button id="settingsbtn" class="ghost" data-t-title="settings_title" title="הגדרות">⚙</button>
    <span id="status" data-t="ready">מוכן</span>
  </div>

  <div id="editor" contenteditable="true" dir="rtl" spellcheck="false"
       data-t-ph="placeholder" data-ph=""></div>
  <div class="row" style="border-bottom:none;border-top:1px solid var(--line)">
    <button id="copyAll" class="primary"><span data-t="copy_all">העתק פרומפט מלא</span> <kbd style="color:#140b03;border-color:#140b0355">⌘↩</kbd></button>
    <button id="save" data-t="save">שמור לקובץ</button>
    <button id="clear" class="ghost" data-t="clear">נקה</button>
    <label class="opt"><input type="checkbox" id="optNotes" checked style="margin:0"> <span data-t="notes">הערות לסוכן</span></label>
    <label class="opt" data-t-title="errors_title"><input type="checkbox" id="optErrors" style="margin:0"> <span data-t="errors">שגיאות</span><span id="errCount" class="cnt"></span></label>
    <label class="opt" data-t-title="path_title"><input type="checkbox" id="optPath" style="margin:0"> <span data-t="path">מסלול</span><span id="pathCount" class="cnt"></span></label>
    <span id="warn"></span>
    <span id="ctx"></span>
  </div>

  <div id="hist" class="side">
    <div class="row"><span class="lbl" data-t="history_lbl">History</span><button id="histclose" class="ghost" data-t="close">סגור</button></div>
    <div id="histlist"></div>
  </div>

  <div id="settings" class="side">
    <div class="row"><span class="lbl" data-t="settings_lbl">Settings</span><button id="settingsclose" class="ghost" data-t="close">סגור</button></div>
    <div class="sbody">
      <div class="srow"><span data-t="s_ui_lang">שפת הממשק</span>
        <div class="seg" id="langseg"><button data-lang="he">עברית</button><button data-lang="en">English</button></div></div>
      <div class="srow"><span data-t="s_stt_lang">שפת ההקלטה</span>
        <select id="sttlang"><option value="">auto</option><option value="he">עברית</option><option value="en">English</option><option value="es">Español</option><option value="ar">العربية</option><option value="ru">Русский</option><option value="fr">Français</option><option value="de">Deutsch</option></select></div>
      <div class="srow"><span data-t="s_key">מפתח OpenAI</span>
        <div style="display:flex;gap:6px;flex:1 1 auto;justify-content:flex-end"><input id="apikey" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false" style="flex:1 1 auto;min-width:120px;max-width:260px"><button id="keysave" class="primary" data-t="save_key">שמור</button></div></div>
      <div class="snote" data-t="key_note">נשמר ב-~/.config/emu-composer/openai-key (600), מחוץ לריפו. הדפדפן לא מקבל אותו בחזרה.</div>
      <div class="snote" id="keystate"></div>
      <div class="srow"><span data-t="s_notes">הערות לסוכן בפרומפט</span><input type="checkbox" id="optNotes2"></div>
      <div class="srow"><span data-t="s_dir">כיוון טקסט</span><div class="seg" id="dirseg2"><button data-dir="rtl">RTL</button><button data-dir="ltr">LTR</button><button data-dir="auto">AUTO</button></div></div>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s)

// ------------------------------------------------------------------- i18n ---
const I18N = {

// ----------------------------------------------------- assembling the text --
let orphans = 0
const PF_NAME = { ios: 'iOS', android: 'Android' }
function serialize() {
  const used = [], marks = []; orphans = 0

  const walk = n => {
    if (n.nodeType === 3) return n.nodeValue
    if (n.nodeType !== 1) return ''
    if (n.classList.contains('interim')) return ''
    if (n.classList.contains('chip')) {

      if (r.kind === 'mark') { if (!marks.some(m => m.n === r.n)) marks.push(r); return `@mark${r.n}` }
      let i = used.findIndex(u => u.uid === n.dataset.uid)

  }

  // A line of dashes separates items: each becomes its own numbered heading, so an agent
  // treats five asks as five, not as one paragraph to skim.
  const items = body.split(/\n\s*-{2,}\s*(?:\n|$)/).map(s => s.trim()).filter(Boolean)

    ? [`# Task (${items.length} separate items — address each one)`, '', ...items.flatMap((s, i) => [`## ${i + 1}`, s, ''])]

  if (dual) L.splice(1, 0, '(two platforms: @ios* elements were picked on the iOS Simulator, @android* on the Android emulator — the same screen on each)')
  const elementLines = list => list.forEach(u => L.push(`### ${tagOf(u)} — ${JSON.stringify(u.label)}${u.what ? `  (${u.what})` : ''}`, u.block, ''))
  if (used.length && dual) {

    for (const pf of ['ios', 'android', '']) { const list = used.filter(u => (u.platform || '') === pf); if (list.length) { L.push(`## ${PF_NAME[pf] || 'Unknown device'}`, ''); elementLines(list) } }

    const files = [...new Set(marks.map(m => m.file).filter(Boolean))]
    L.push('# Marks', `Drawn by the user on the screenshot${files.length ? ` — open ${files.join(', ')} to see them; the number in each badge is the mark's number` : ''}.`, '')
    marks.sort((a, b) => a.n - b.n).forEach(m => L.push(`### @mark${m.n} — ${m.colorName} ${m.shape === 'rect' ? 'box' : m.shape}${dual && m.platform ? ` (${PF_NAME[m.platform]})` : ''}`, m.block + (m.file ? `\nimage:    ${m.file}` : ''), ''))

  // Elements picked across several screens: say so, so the agent does not assume one.
  const screenLine = (c, list) => {

  if ($('#optErrors').checked && extras.errors) L.push(extras.errors, '')

}

  try {
    const crops = used.map(u => u.node && u.captureId === captureId ? cropOf(u.node) : '')
    const d = await (await fetch('/api/save', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, crops, screen: fullShot() }) })).json()
    if (d.error) throw new Error(d.error)
    await navigator.clipboard.writeText(d.text).catch(() => {})
    setStatus(t('st_saved', d.file), 'ok')
  } catch (e) { setStatus(e.message, 'err') }
}
$('#clear').onclick = () => { ed.innerHTML = ''; refs.clear(); refN = 0; updateDual(); saveDraft(); syncMarks(); setStatus(t('st_cleared')) }

function cropOf(n, pad = 8) {
  if (!img.naturalWidth || mode !== 'collect') return ''
  const c = document.createElement('canvas')
  const x = Math.max(0, n.x * scale - pad), y = Math.max(0, n.y * scale - pad)
  const w = Math.min(img.naturalWidth - x, n.w * scale + pad * 2), h = Math.min(img.naturalHeight - y, n.h * scale + pad * 2)
  if (w <= 0 || h <= 0) return ''
  c.width = w; c.height = h
  c.getContext('2d').drawImage(img, x, y, w, h, 0, 0, w, h)
  return c.toDataURL('image/png')
}
function fullShot() {
  if (!img.naturalWidth) return ''
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight
  c.getContext('2d').drawImage(img, 0, 0)
  return c.toDataURL('image/jpeg', 0.85)
}

// --------------------------------------------------------- draft + history --
function saveDraft() {
  const payload = JSON.stringify({ html: ed.innerHTML, refs: [...refs], refN })
  try { localStorage.setItem('emucomposer.draft', payload) }
  catch { try { localStorage.removeItem('emucomposer.history'); localStorage.setItem('emucomposer.draft', payload) } catch {} }
}
function loadDraft() {
  try {
    const d = JSON.parse(localStorage.getItem('emucomposer.draft') || 'null'); if (!d) return
    ed.innerHTML = d.html || ''; refs = new Map(d.refs || []); refN = d.refN || 0
    for (const c of ed.querySelectorAll('.chip')) { c.classList.add('stale'); refN = Math.max(refN, Number((c.dataset.uid || 'r0').slice(1)) || 0); const r = refOf(c); if (r?.platform && !c.dataset.platform) c.dataset.platform = r.platform }
    updateDual()
  } catch {}
}
function pushHistory(text) {
  try {
    const h = JSON.parse(localStorage.getItem('emucomposer.history') || '[]')
    h.unshift({ at: Date.now(), text, html: ed.innerHTML, refs: [...refs], refN })
    for (let keep = 40; keep >= 5; keep = Math.floor(keep / 2)) { try { localStorage.setItem('emucomposer.history', JSON.stringify(h.slice(0, keep))); break } catch {} }
  } catch {}
}
function renderHistory() {
  let h = []; try { h = JSON.parse(localStorage.getItem('emucomposer.history') || '[]') } catch {}
  $('#histlist').innerHTML = h.map((x, i) => {
    const task = (x.text.split('\n# ')[0] || '').replace(/^# Task\n/, '')
    return `<div class="hitem" data-i="${i}"><div class="t">${new Date(x.at).toLocaleString(lang === 'he' ? 'he-IL' : 'en-GB')}</div><div class="p">${escapeHTML(task)}</div></div>`
  }).join('') || `<div class="hitem" style="color:var(--dim2)">${escapeHTML(t('hist_empty'))}</div>`
}
$('#histbtn').onclick = () => { renderHistory(); $('#hist').classList.add('show') }
$('#histclose').onclick = () => $('#hist').classList.remove('show')
$('#histlist').addEventListener('click', async e => {
  const it = e.target.closest('.hitem[data-i]'); if (!it) return
  const h = JSON.parse(localStorage.getItem('emucomposer.history') || '[]')[Number(it.dataset.i)]; if (!h) return
  if (e.altKey) { await navigator.clipboard.writeText(h.text).catch(() => {}); setStatus(t('st_hist_copied'), 'ok'); return }
  ed.innerHTML = h.html; refs = new Map(h.refs); refN = h.refN
  for (const c of ed.querySelectorAll('.chip')) { c.classList.add('stale'); refN = Math.max(refN, Number((c.dataset.uid || 'r0').slice(1)) || 0); refOf(c) }
  $('#hist').classList.remove('show'); saveDraft(); syncMarks(); setStatus(t('st_hist_restored'), 'ok')
})

// ------------------------------------------------------------- dictation ----
// Segments are cut at PAUSES, not on a timer: the meter watches the input level and stops
// the recorder ~450 ms into silence once a segment holds speech, so a word is never split
// mid-syllable. A hard cap keeps a monologue from becoming one giant upload. Each segment
// leaves an interim marker at the caret the moment it is cut, and the transcript replaces
// that marker — so the text lands where the caret WAS, even if you kept typing elsewhere.
let mediaRec = null, recOn = false, audioCtx = null, stream = null
let seg = null, segN = 0, lastTranscript = ''
const SEG_MIN_MS = 1200, SEG_MAX_MS = 15000, SILENCE_MS = 450, SPEECH_LEVEL = 0.06

async function toggleRec() {
  if (recOn) return stopRec()
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
  } catch (e) { return setStatus(t('st_mic', e.message), 'err') }
  recOn = true
  $('#rec').classList.add('on'); $('#reclabel').textContent = t('rec_stop')
  setStatus(t('st_rec_hint'), 'busy')
  startMeter()
  startSegment()
}
function startSegment() {
  if (!recOn) return
  const mime = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find(t => MediaRecorder.isTypeSupported(t)) || ''
  mediaRec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined)
  const s = seg = { n: ++segN, t0: Date.now(), lastLoud: Date.now(), hadSpeech: false, marker: null }
  mediaRec.ondataavailable = ev => { if (s.hadSpeech && ev.data.size > 1000) sendSegment(ev.data, s); else s.marker?.remove() }
  mediaRec.onstop = () => { if (recOn) startSegment(); else stream?.getTracks().forEach(t => t.stop()) }
  mediaRec.start()
}
function cutSegment() {
  if (!seg || mediaRec?.state !== 'recording') return
  if (seg.hadSpeech) {
    // Marker goes in NOW, at the caret, so the transcript has a home even if the user moves on.
    restoreCaret()
    document.execCommand('insertHTML', false, `<span class="interim" data-seg="${seg.n}">…</span>`)
    seg.marker = ed.querySelector(`.interim[data-seg="${seg.n}"]`)
    caretAfter(seg.marker)
  }
  mediaRec.stop()
}
function stopRec() {
  recOn = false
  if (mediaRec?.state === 'recording') cutSegment()
  $('#rec').classList.remove('on'); $('#reclabel').textContent = t('rec')
  audioCtx?.close().catch(() => {}); audioCtx = null
  setStatus(t('st_rec_done'), 'ok')
}
function startMeter() {
  audioCtx = new AudioContext()
  const src = audioCtx.createMediaStreamSource(stream)
  const an = audioCtx.createAnalyser(); an.fftSize = 1024; src.connect(an)
  const buf = new Float32Array(an.fftSize)
  const tick = () => {
    if (!recOn) return
    an.getFloatTimeDomainData(buf)
    let sum = 0; for (const v of buf) sum += v * v
    const rms = Math.sqrt(sum / buf.length)
    $('#level i').style.width = Math.min(100, rms / 0.25 * 100) + '%'
    const now = Date.now()
    if (seg) {
      if (rms > SPEECH_LEVEL) { seg.lastLoud = now; seg.hadSpeech = true }
      const len = now - seg.t0, quiet = now - seg.lastLoud
      if ((seg.hadSpeech && len > SEG_MIN_MS && quiet > SILENCE_MS) || len > SEG_MAX_MS) cutSegment()
    }
    requestAnimationFrame(tick)
  }
  tick()
}
async function sendSegment(blob, s) {
  const b64 = await new Promise(ok => { const r = new FileReader(); r.onload = () => ok(r.result.split(',')[1]); r.readAsDataURL(blob) })
  try {
    const d = await (await fetch('/api/transcribe', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ audio: b64, mime: blob.type, language: sttOverride ?? sttLanguage, prompt: lastTranscript }) })).json()
    if (d.error) { setStatus(d.error, 'err'); if (/OpenAI key/.test(d.error)) stopRec(); s.marker?.remove(); return }
    const t = (d.text || '').trim()
    if (!t) { s.marker?.remove(); return }
    lastTranscript = (lastTranscript + ' ' + t).slice(-600)
    placeTranscript(s.marker, t)
    if (recOn) setStatus(t('st_rec'), 'busy')
  } catch (e) { setStatus(t('st_stt_fail', e.message), 'err'); s.marker?.remove() }
}
// Replace the marker through the selection so the insert is undoable, then put the user's
// caret back where it was.
function placeTranscript(marker, text) {
  const s = getSelection()
  const userRange = s.rangeCount && ed.contains(s.anchorNode) ? s.getRangeAt(0).cloneRange() : null
  ed.focus({ preventScroll: true })
  if (marker && ed.contains(marker)) {
    const r = document.createRange(); r.selectNode(marker); s.removeAllRanges(); s.addRange(r)
  } else restoreCaret()
  const before = s.getRangeAt(0).startContainer, off = s.getRangeAt(0).startOffset
  const prev = before.nodeType === 3 ? before.nodeValue.slice(0, off) : ''
  document.execCommand('insertText', false, (prev && !/\s$/.test(prev) ? ' ' : '') + text + ' ')
  if (userRange && !(marker && userRange.intersectsNode?.(marker))) { try { s.removeAllRanges(); s.addRange(userRange) } catch {} }
  rememberCaret(); saveDraft()
}
$('#rec').onclick = toggleRec

// ------------------------------------------------------ direction & key -----
// Text direction lives in settings only; the header stays for the device and the prompt.
function setDir(d) {
  if (!['rtl', 'ltr', 'auto'].includes(d)) d = 'rtl'
  ;[...$('#dirseg2').children].forEach(x => x.classList.toggle('on', x.dataset.dir === d))
  ed.dir = d
  ed.style.textAlign = d === 'ltr' ? 'left' : d === 'rtl' ? 'right' : ''
  try { localStorage.setItem('emucomposer.dir', d) } catch {}
}
// ---------------------------------------------------------------- settings ---
let sttOverride = null
try { const v = localStorage.getItem('emucomposer.sttLang'); if (v !== null) sttOverride = v } catch {}
$('#settingsbtn').onclick = () => { $('#hist').classList.remove('show'); $('#settings').classList.toggle('show') }
$('#settingsclose').onclick = () => $('#settings').classList.remove('show')
$('#langseg').addEventListener('click', e => {
  const b = e.target.closest('[data-lang]'); if (!b) return
  lang = b.dataset.lang; try { localStorage.setItem('emucomposer.lang', lang) } catch {}
  applyLang(); setStatus(t('ready'))
})
$('#sttlang').addEventListener('change', e => { sttOverride = e.target.value; try { localStorage.setItem('emucomposer.sttLang', sttOverride) } catch {} })
$('#optNotes2').addEventListener('change', e => { $('#optNotes').checked = e.target.checked; try { localStorage.setItem('emucomposer.notes', e.target.checked ? '1' : '0') } catch {} })
$('#optNotes').addEventListener('change', e => { $('#optNotes2').checked = e.target.checked; try { localStorage.setItem('emucomposer.notes', e.target.checked ? '1' : '0') } catch {} })
$('#dirseg2').addEventListener('click', e => { const b = e.target.closest('[data-dir]'); if (b) setDir(b.dataset.dir) })
$('#keysave').onclick = async () => {
  const key = $('#apikey').value.trim()
  if (!key) return setStatus(t('st_key_missing'), 'err')
  try {
    const d = await (await fetch('/api/key', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key }) })).json()
    if (d.error) throw new Error(d.error)
    $('#apikey').value = ''; $('#rec').disabled = false
    $('#keystate').innerHTML = escapeHTML(t('key_set')) + '<bdi dir="ltr">' + escapeHTML(d.hint) + '</bdi>'
    setStatus(t('st_key_saved'), 'ok')
  } catch (e) { setStatus(e.message, 'err') }
}
$('#apikey').addEventListener('keydown', e => e.key === 'Enter' && $('#keysave').click())

// ---------------------------------------------------------------- startup ---
addEventListener('keydown', e => {
  const meta = e.metaKey || e.ctrlKey
  if (meta && e.key === 'Enter') { e.preventDefault(); $('#copyAll').click() }
  else if (meta && e.key.toLowerCase() === 'e') { e.preventDefault(); setMode(mode === 'collect' ? 'use' : 'collect') }
  else if (meta && e.shiftKey && e.key.toLowerCase() === 'r') { e.preventDefault(); toggleRec() }
  else if (e.key === 'Escape') {
    if ($('#hist').classList.contains('show')) $('#hist').classList.remove('show')
    else if ($('#settings').classList.contains('show')) $('#settings').classList.remove('show')
    else if (drawing) { drawing = null; renderMarks() }
    else if (tool !== 'pick') setTool('pick')
  }
})
addEventListener('resize', () => { if (mode === 'collect') { drawOverlay(); renderMarks() } })
document.addEventListener('visibilitychange', () => {
  if (document.hidden || mode !== 'collect') return
  if (!nodes.length || pendingCapture) { pendingCapture = false; capture() }
})
async function health() {
  try {
    const h = await (await fetch('/api/health')).json()
    $('#rec').disabled = !h.stt
    sttLanguage = h.language || ''
    if (h.app) document.title = `${h.app} · emu-composer`
    $('#rec').title = h.stt ? '' : t('key_needed')
    $('#keystate').innerHTML = h.stt ? escapeHTML(t('key_set')) + '<bdi dir="ltr">' + escapeHTML(h.hint) + '</bdi>' : escapeHTML(t('key_needed'))
    if (sttOverride === null && !$('#sttlang').value) $('#sttlang').value = h.language || ''
    renderDevices(h.devices || [], h.serial || '')
    renderProjects(h.projects || [], h.active || '')
    renderProblems(h.problems || [])
    if (!activeSerial) activeSerial = h.serial || ''
    try {
      const want = localStorage.getItem('emucomposer.device')
      if (want && want !== h.serial && (h.devices || []).some(d => d.serial === want && d.state === 'device') && !wantedOnce) {
        wantedOnce = true
        fetch('/api/device', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ serial: want }) })
      }
    } catch {}
    const p = $('#agentpill')
    p.className = 'pill ' + (h.agent ? 'on' : h.device === 'device' ? 'bad' : 'bad')
    p.title = h.agent ? t('agent_on_tip') : t('agent_off_tip', h.agentReason || 'no device')
    if (h.device !== 'device') markLost(t('no_device_state', h.device))
  } catch {}
}
// ---- devices: several emulators may run; the page decides which one is mirrored.
let deviceSig = '', wantedOnce = false
function renderDevices(devices, active) {
  const sel = $('#device')
  const usable = devices.filter(d => d.state === 'device')
  const sig = usable.map(d => d.serial + d.avd).join('|') + '#' + active
  if (sig === deviceSig) return
  deviceSig = sig
  sel.innerHTML = usable.length
    ? usable.map(d => `<option value="${d.serial}"${d.serial === active ? ' selected' : ''}>${escapeHTML((d.avd || d.model || d.serial) + (d.avd || d.model ? ` · ${d.serial}` : ''))}</option>`).join('')
    : `<option value="">${escapeHTML(t('device_none'))}</option>`
  sel.classList.toggle('bad', !usable.length)
  sel.title = usable.length > 1 ? t('device_many', usable.length) : t('device_title')
}
// ---- projects: one daemon serves them all; the switch is BY HAND, never guessed. The
// active project decides which sources a reference resolves against and which repo the
// prompt names, so it is a deliberate choice, like the device.
let projectSig = '', activeProject = ''
function renderProjects(list, active) {
  const sel = $('#project')
  const sig = list.map(p => p.id).join('|') + '#' + active
  if (sig === projectSig) return
  projectSig = sig
  sel.innerHTML = list.length
    ? list.map(p => `<option value="${escapeHTML(p.id)}"${p.id === active ? ' selected' : ''}>${escapeHTML(p.name)}</option>`).join('')
    : `<option value="">${escapeHTML(t('project_none'))}</option>`
  sel.style.display = list.length > 1 ? '' : 'none'
  sel.title = t('project_title')
  if (active && active !== activeProject) {
    const was = activeProject
    activeProject = active
    if (was) onProjectSwitched(list.find(p => p.id === active))
  }
}
// Everything resolved against the old repo is stale the moment the project changes.
function onProjectSwitched(p) {
  nodes = []; captureId = 0; ctx = null; extras = { errors: '', path: '', errorCount: 0, pathSteps: 0 }
  for (const c of ed.querySelectorAll('.chip')) c.classList.add('stale')
  drawOverlay()
  fetchNotes()
  if (p) setStatus(t('st_project_on', p.name), 'ok')
  if (mode === 'collect') capture()
  health()
}
$('#project').addEventListener('change', async e => {
  const id = e.target.value; if (!id) return
  setStatus(t('st_project', e.target.selectedOptions[0]?.textContent || ''), 'busy')
  try {
    const d = await (await fetch('/api/project', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id }) })).json()
    if (d.error) throw new Error(d.error)
    renderProjects(d.projects || [], d.active || '')
  } catch (err) { setStatus(err.message, 'err') }
})

// ---- problems: what is wrong, in words, with the button that fixes it. Silence and a
// stale screenshot look identical; this is what tells them apart.
let problemSig = ''
function renderProblems(list) {
  const box = $('#problems')
  const sig = (list || []).map(p => p.code + p.text).join('|')
  if (sig === problemSig) return
  problemSig = sig
  box.innerHTML = (list || []).map(p =>
    `<div class="prob ${p.level}"><b>${p.level === 'error' ? '✘' : p.level === 'warn' ? '!' : 'i'}</b><span>${escapeHTML(p.text)}</span>` +
    (p.action ? `<button data-act="${p.action}">${escapeHTML(t(p.action === 'launch' ? 'prob_launch' : 'prob_agent'))}</button>` : '') + '</div>').join('')
  box.classList.toggle('on', Boolean((list || []).length))
  for (const b of box.querySelectorAll('button')) b.onclick = async () => {
    b.disabled = true
    try {
      if (b.dataset.act === 'launch') { await fetch('/api/launch', { method: 'POST' }); await new Promise(r => setTimeout(r, 1200)); if (mode === 'collect') await capture() }
      else await fetch('/api/agent/restart', { method: 'POST' })
    } finally { b.disabled = false; health() }
  }
}

// ---- the opt-in prompt sections. Fetched together, once per capture, and only for the
// boxes that are ticked — the errors call costs an adb round trip.
let extras = { errors: '', path: '', errorCount: 0, pathSteps: 0 }
async function refreshExtras() {
  const wantErr = $('#optErrors').checked, wantPath = $('#optPath').checked
  if (!wantErr && !wantPath) { extras = { errors: '', path: '', errorCount: 0, pathSteps: 0 }; return paintExtras() }
  try {
    extras = await (await fetch(`/api/extras?errors=${wantErr ? 1 : 0}`)).json()
  } catch { /* keep what we had */ }
  paintExtras()
}
function paintExtras() {
  const e = $('#errCount'), p = $('#pathCount')
  e.textContent = $('#optErrors').checked ? String(extras.errorCount || 0) : ''
  e.classList.toggle('has', Boolean($('#optErrors').checked && extras.errorCount))
  p.textContent = $('#optPath').checked ? String(extras.pathSteps || 0) : ''
}
for (const id of ['#optErrors', '#optPath']) $(id).addEventListener('change', () => {
  try { localStorage.setItem('emucomposer' + id.replace('#opt', '.'), $(id).checked ? '1' : '0') } catch {}
  refreshExtras()
})

// Server-sent events: device list / active device / agent state arrive the moment they
// change (adb track-devices behind it), in either mode. Falls back to the health poll.
let sse = null, activeSerial = '', clientId = '', lastHash = ''
function connectEvents() {
  try { sse?.close() } catch {}
  sse = new EventSource(`/api/events?watch=${mode === 'collect' ? 1 : 0}`)
  sse.onmessage = async e => {
    const ev = JSON.parse(e.data)
    if (ev.type === 'screen') {
      // The device's UI tree changed under a still capture (the user drove the emulator
      // window itself). Re-capture — unless a drawing is in progress or the tab is hidden.
      if (mode !== 'collect' || ev.hash === lastHash) return
      if (drawing || document.hidden) { pendingCapture = true; return }
      await capture(); setStatus(t('st_screen_changed'), 'ok')
    } else if (ev.type === 'device') {
      if (ev.client) clientId = ev.client
      renderDevices(ev.devices || [], ev.serial || '')
      if (ev.projects) renderProjects(ev.projects, ev.active || '')
      if (ev.serial !== activeSerial) {
        const was = activeSerial; activeSerial = ev.serial
        if (!ev.serial) { markLost(t('st_no_device')); return }
        markAlive(); nodes = []; captureId = 0; drawOverlay()
        for (const c of ed.querySelectorAll('.chip')) c.classList.add('stale')
        if (was !== undefined) setStatus(t('st_connected', ev.serial), 'ok')
        if (mode === 'collect') capture()
      }
    } else if (ev.type === 'project') {
      renderProjects(ev.projects || [], ev.active || '')
    } else if (ev.type === 'agent') {
      const p = $('#agentpill'); p.className = 'pill ' + (ev.ready ? 'on' : 'bad')
      if (ev.ready && mode === 'collect' && !nodes.length) capture()
    }
  }
  sse.onerror = () => { setTimeout(connectEvents, 3000) }
}
connectEvents()
// The last device chosen by hand is remembered per project and re-selected when it is back.
$('#device').addEventListener('change', async e => {
  const serial = e.target.value; if (!serial) return
  setStatus(t('st_switching', serial), 'busy')
  try {
    const d = await (await fetch('/api/device', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ serial }) })).json()
    if (d.error) throw new Error(d.error)
    try { localStorage.setItem('emucomposer.device', serial) } catch {}
    setStatus(t('st_mirroring', serial), 'ok')
  } catch (err) { setStatus(err.message, 'err') }
})

$('#agentpill').onclick = async () => { setStatus(t('st_agent_starting'), 'busy'); const d = await (await fetch('/api/agent/restart', { method: 'POST' })).json(); setStatus(d.ok ? t('st_agent_on') : d.reason, d.ok ? 'ok' : 'err'); health() }
fetchNotes()
{ let d = 'rtl'; try { d = localStorage.getItem('emucomposer.dir') || 'rtl' } catch {} setDir(d) }
try { const n = localStorage.getItem('emucomposer.notes'); if (n !== null) $('#optNotes').checked = n === '1' } catch {}
try { for (const id of ['Errors', 'Path']) { const v = localStorage.getItem('emucomposer.' + id); if (v !== null) $('#opt' + id).checked = v === '1' } } catch {}
$('#optNotes2').checked = $('#optNotes').checked
if (sttOverride !== null) $('#sttlang').value = sttOverride
applyLang()
loadDraft(); syncMarks()
health(); setInterval(health, 20000)
setMode('collect')
