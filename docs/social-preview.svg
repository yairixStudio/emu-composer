<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d13"/>
      <stop offset="0.58" stop-color="#111520"/>
      <stop offset="1" stop-color="#1d1220"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(180 80) rotate(35) scale(610 420)">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="screenClip">
      <rect x="650" y="94" width="706" height="493" rx="18"/>
    </clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <circle cx="1170" cy="70" r="180" fill="#0ea5e9" opacity="0.06"/>

  <g transform="translate(76 72)">
    <rect width="62" height="62" rx="15" fill="#f97316"/>
    <text x="31" y="42" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="34" font-weight="800" fill="#12141b">@</text>
    <text x="82" y="42" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="29" font-weight="750" letter-spacing="-0.5" fill="#f8fafc">emu-composer</text>
  </g>

  <g transform="translate(76 188)">
    <text font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="57" font-weight="800" letter-spacing="-2" fill="#f8fafc">
      <tspan x="0" y="0">Point at the UI.</tspan>
      <tspan x="0" y="68">Get the source.</tspan>
    </text>
    <text x="2" y="178" font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="500" fill="#aeb7c6">
      Visual prompts for AI coding agents
    </text>

    <g transform="translate(0 226)">
      <rect width="152" height="40" rx="20" fill="#f97316" fill-opacity="0.14" stroke="#f97316" stroke-opacity="0.52"/>
      <text x="76" y="27" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#fdba74">Android + iOS</text>
      <rect x="164" width="142" height="40" rx="20" fill="#0ea5e9" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.42"/>
      <text x="235" y="27" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#7dd3fc">Source-aware</text>
      <rect x="318" width="118" height="40" rx="20" fill="#8b5cf6" fill-opacity="0.13" stroke="#a78bfa" stroke-opacity="0.42"/>
      <text x="377" y="27" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#c4b5fd">Open source</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="630" y="74" width="726" height="533" rx="24" fill="#080a0f" stroke="#303747" stroke-width="2"/>
    <circle cx="662" cy="99" r="6" fill="#fb7185"/>
    <circle cx="684" cy="99" r="6" fill="#fbbf24"/>
    <circle cx="706" cy="99" r="6" fill="#34d399"/>
    <image href="composer.png" x="650" y="122" width="706" height="465" preserveAspectRatio="xMidYMid slice" clip-path="url(#screenClip)"/>
  </g>

  <rect x="0" y="632" width="1280" height="8" fill="#f97316"/>
</svg>
