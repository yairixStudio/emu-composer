name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm run check
      - run: npm test
  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcrun swiftc -typecheck -framework AppKit mac/Banner/main.swift
